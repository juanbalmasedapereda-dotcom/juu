button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mostaza);outline-offset:3px}
.scr{position:fixed;inset:0;display:none;z-index:5}
.scr.on{display:block}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;letter-spacing:.01em}
.hand{font-family:Caveat,cursive;font-weight:700}
/* ===== MENÚ ===== */
#menu .letrero{position:absolute;left:50%;top:calc(var(--safe-t) + 6px);width:min(92vw,400px);transform-origin:50% -40px;translate:-50% 0;animation:swing 5s ease-in-out infinite}
#menu.enter .letrero{animation:drop 1.1s var(--spring) both, swing 5s 1.1s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-140%) rotate(-8deg)}to{transform:none}}
@keyframes swing{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.cadenas{position:absolute;left:0;right:0;top:-30px;height:34px;display:flex;justify-content:space-between;padding:0 18%}
.cadenas i{width:4px;height:100%;background:repeating-linear-gradient(#cfc6b4 0 5px,#6e6658 5px 7px);border-radius:2px}
.tabla{position:relative;margin-top:4px;background:linear-gradient(#a86a3a,#7a4522);border:3px solid var(--tinta);border-radius:18px;padding:12px 14px 12px;box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.25)}
.tabla::before{content:"";position:absolute;inset:6px;border-radius:12px;border:2px dashed rgba(255,230,190,.35);pointer-events:none}
.bombillas{position:absolute;inset:-2px;pointer-events:none}
.bombillas b{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px 2px rgba(255,220,120,.85);border:1.5px solid var(--tinta);animation:bulb 1.2s steps(1) infinite}
.bombillas b:nth-child(2n){animation-delay:.6s}
@keyframes bulb{0%{background:#ffe9a0;box-shadow:0 0 9px 3px rgba(255,220,120,.9)}50%{background:#b9925a;box-shadow:none}}
.logo{position:relative;text-align:center;font-family:"Lilita One";font-size:clamp(44px,13.5vw,60px);line-height:.95;color:var(--crema);paint-order:stroke fill;-webkit-text-stroke:7px var(--tinta);text-shadow:0 5px 0 var(--tinta),0 10px 18px rgba(0,0,0,.35);letter-spacing:.01em}
.logo span{display:inline-block;animation:hop 2.6s var(--ease) infinite}
.logo span:nth-child(odd){color:var(--mostaza)}
@keyframes hop{0%,80%,100%{transform:none}86%{transform:translateY(-7px) rotate(-4deg)}93%{transform:translateY(1px)}}
.cinta{display:block;margin:8px auto 0;width:max-content;max-width:100%;background:var(--tomate);color:#fff;font-family:Caveat;font-size:24px;line-height:1;padding:4px 18px 6px;border:2.5px solid var(--tinta);border-radius:6px;transform:rotate(-2deg);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.bote{position:absolute;right:12px;top:calc(var(--safe-t) + 150px);display:none}
.topbar{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 168px);display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--papel);border:2.5px solid var(--tinta);border-radius:999px;padding:5px 12px 5px 6px;font-size:15px;box-shadow:0 4px 10px rgba(0,0,0,.22)}
.chip .moneda{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f2b33d 55%,#b8800f);border:2px solid var(--tinta);display:grid;place-items:center;font-family:"Lilita One";font-size:13px;color:var(--tinta)}
.chip .estrella{width:24px;height:24px;color:var(--mostaza)}
.pizarra{position:absolute;left:10px;right:10px;bottom:calc(var(--safe-b) + 10px);max-width:440px;margin:0 auto;background:radial-gradient(120% 90% at 30% 20%,var(--pizarra2),var(--pizarra));border:10px solid var(--madera);border-image:linear-gradient(135deg,#b07040,#6a3a18 60%,#9a6034) 1;outline:3px solid var(--tinta);border-radius:4px;padding:10px 14px 12px;color:var(--tiza);box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.35)}
#menu.enter .pizarra{animation:subir .9s .25s var(--ease) both}
@keyframes subir{from{transform:translateY(110%)}to{transform:none}}
.pizarra::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.025) 0 2px,transparent 2px 5px);mix-blend-mode:screen}
.pz-cab{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
.pz-m{display:flex;align-items:center;gap:4px;font-family:Caveat;font-size:20px;color:var(--mostaza);min-width:70px}
.pz-m:last-child{justify-content:flex-end}
.pz-m .ico{width:20px;height:20px;fill:var(--mostaza);stroke:none}
.pz-m .moneda{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f2b33d 55%,#b8800f);border:1.5px solid var(--tinta);display:grid;place-items:center;font-family:"Lilita One";font-size:11px;color:var(--tinta)}
.pz-t{font-family:Caveat;font-size:30px;line-height:1;text-align:center;color:#fff;position:relative;white-space:nowrap}
.pz-t::after{content:"";display:block;height:3px;width:58%;margin:2px auto 0;background:var(--tiza);border-radius:2px;opacity:.7;transform:rotate(-1deg)}
.plato{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:4px 4px;border-radius:10px;text-align:left;position:relative;transition:transform .15s var(--ease),background .15s}
.plato:active{transform:scale(.97);background:rgba(255,255,255,.07)}
.plato .n{font-family:Caveat;font-size:12px;opacity:.6;width:16px}
.plato .tx{display:flex;flex-direction:column;min-width:0}
.plato .tx b{font-family:"Lilita One";font-weight:400;font-size:23px;line-height:1.05;color:#fff;white-space:nowrap}
.plato .tx small{font-family:Caveat;font-size:18px;line-height:1;opacity:.82}
.plato .pts{flex:1;align-self:center;border-bottom:3px dotted rgba(244,241,230,.4);margin:0 2px;min-width:8px;transform:translateY(4px)}
.plato .pr{font-family:Caveat;font-size:22px;color:var(--mostaza);white-space:nowrap}
.plato.prim{background:linear-gradient(90deg,rgba(224,70,44,.95),rgba(200,55,35,.9));border:2.5px solid var(--tinta);box-shadow:0 5px 0 var(--tomate-o),0 9px 16px rgba(0,0,0,.35);margin:2px 0 8px;padding:6px 10px}
.plato.prim .tx b{font-size:28px}
.plato.prim .pr{color:#fff}
.plato.prim .pts{border-color:rgba(255,255,255,.5)}
.pz-pie{position:absolute;top:-36px;right:4px;display:flex;gap:8px;z-index:2}
.pz-pie .redondo{background:var(--pizarra);border:3px solid var(--madera);outline:2px solid var(--tinta);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.redondo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2px solid rgba(244,241,230,.45);color:var(--tiza);transition:transform .15s}
.redondo:active{transform:scale(.9)}
.redondo.inst{width:auto;padding:0 14px;border-radius:999px;gap:6px;display:none;align-items:center;font-size:14px}
.redondo.inst.on{display:flex}
/* ===== PANTALLAS DE PAPEL ===== */
.hoja{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(130% 80% at 50% 0%,#3a2418 0,#1e130d 70%);}
.hoja::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 22px);pointer-events:none}
.cab{position:relative;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 12px 10px;z-index:2}
.cab h2{font-family:"Lilita One";font-weight:400;font-size:28px;color:var(--crema);flex:1;-webkit-text-stroke:5px var(--tinta);paint-order:stroke fill;text-shadow:0 4px 0 var(--tinta)}
.btn-r{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--papel);border:2.5px solid var(--tinta);box-shadow:0 4px 0 var(--tinta);transition:transform .12s}
.btn-r:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.scroll{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 12px calc(var(--safe-b) + 24px);scrollbar-width:thin;scrollbar-color:var(--madera) transparent}
.toldo{position:relative;margin:18px 0 0;border:3px solid var(--tinta);border-radius:12px 12px 0 0;padding:12px 14px 22px;color:#fff;overflow:hidden;background:repeating-linear-gradient(90deg,var(--tc,#e0462c) 0 26px,#fff6e8 26px 52px)}
.toldo .tl{position:relative;background:var(--tinta);display:inline-block;border-radius:10px;padding:6px 12px 8px;max-width:calc(100% - 86px)}
.toldo .tl b{display:block;font-family:"Lilita One";font-weight:400;font-size:21px;line-height:1.05;color:var(--crema)}
.toldo .tl small{font-family:Caveat;font-size:19px;line-height:1;color:var(--mostaza)}
.toldo .st{position:absolute;right:10px;top:12px;background:var(--papel);color:var(--tinta);border:2.5px solid var(--tinta);border-radius:999px;padding:3px 10px;display:flex;gap:4px;align-items:center;font-size:15px}
.toldo::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-1px;height:14px;background:radial-gradient(circle at 13px -2px,transparent 12px,#1e130d 13px) 0 0/26px 14px repeat-x}
.corcho{background:linear-gradient(#b98a5a,#a87a4a);border:3px solid var(--tinta);border-top:0;border-radius:0 0 12px 12px;padding:14px 10px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;box-shadow:inset 0 0 30px rgba(60,30,10,.4)}
.ticket{position:relative;background:var(--papel);border:2px solid var(--tinta);border-bottom:0;padding:8px 4px 12px;text-align:center;min-height:96px;transform:rotate(var(--r,0deg));transition:transform .15s var(--ease);box-shadow:0 6px 10px rgba(40,20,5,.35)}
.ticket::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-8px;height:9px;background:linear-gradient(135deg,var(--papel) 50%,transparent 50%) 0 0/9px 9px repeat-x,linear-gradient(225deg,var(--papel) 50%,transparent 50%) 0 0/9px 9px repeat-x}
.ticket::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#c0392b);border:2px solid var(--tinta);z-index:2}
.ticket:active{transform:rotate(var(--r,0deg)) scale(.94)}
.ticket .num{font-family:"Lilita One";font-size:26px;line-height:1;color:var(--tomate)}
.ticket .num small{display:block;font-size:11px;letter-spacing:.08em;color:var(--tinta2)}
.ticket img{width:44px;height:44px;display:block;margin:2px auto}
.ticket .ss{display:flex;justify-content:center;gap:1px;height:16px}
.ticket .ss svg{width:16px;height:16px}
.ticket.lock{filter:grayscale(1) brightness(.75);opacity:.75}
.ticket.lock .num{color:var(--tinta2)}
.ticket .candado{width:30px;height:30px;margin:8px auto 4px;color:var(--tinta2)}
.ticket.nuevo{animation:latido 1.4s ease-in-out infinite}
@keyframes latido{50%{transform:rotate(var(--r,0deg)) scale(1.06)}}
/* ===== COMANDA (antes del nivel) ===== */
.velo{position:absolute;inset:0;background:rgba(20,10,5,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.comanda{position:absolute;left:50%;top:50%;width:min(92vw,400px);max-height:calc(100% - var(--safe-t) - var(--safe-b) - 20px);overflow:auto;translate:-50% -50%;background:var(--papel);border:3px solid var(--tinta);padding:14px 16px 18px;box-shadow:0 24px 60px rgba(0,0,0,.5);background-image:repeating-linear-gradient(transparent 0 29px,rgba(31,111,178,.13) 29px 30px)}
.scr.on .comanda{animation:papel .55s var(--spring) both}
@keyframes papel{from{transform:translateY(40px) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
.comanda::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-11px;height:12px;background:linear-gradient(135deg,var(--papel) 50%,transparent 50%) 0 0/12px 12px repeat-x,linear-gradient(225deg,var(--papel) 50%,transparent 50%) 0 0/12px 12px repeat-x}
.cm-cab{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2.5px dashed var(--tinta);padding-bottom:6px;font-size:13px;color:var(--tinta2)}
.cm-cab b{font-family:"Lilita One";font-weight:400;font-size:30px;color:var(--tomate)}
.cm-cli{display:flex;gap:12px;align-items:center;margin:10px 0 6px}
.cm-cli canvas{width:84px;height:84px;flex:none;border-radius:50%;background:radial-gradient(circle,#ffe6b8,#f2b33d);border:3px solid var(--tinta)}
.cm-cli b{font-family:"Lilita One";font-weight:400;font-size:22px;display:block;line-height:1.05}
.cm-cli small{font-size:14px;color:var(--tinta2);display:block;line-height:1.25;margin-top:2px}
.cm-q{font-family:Caveat;font-size:25px;line-height:1.05;color:var(--azul);margin:6px 0 10px;transform:rotate(-1deg)}
.cm-ped{gap:8px;font-size:13px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.cm-items{display:flex;flex-direction:column-reverse;gap:2px;margin:6px 0 10px}
.cm-it{display:flex;align-items:center;gap:8px;font-family:Caveat;font-size:24px;line-height:1}
.cm-it img{width:40px;height:40px}
.cm-it .q{margin-left:auto;font-family:Nunito;font-size:13px;color:var(--tinta2)}
.cm-meta{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.tag{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--tinta);border-radius:999px;padding:4px 10px;font-size:14px}
.tag .ico{width:18px;height:18px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:16px;background:var(--tomate);color:#fff;border:3px solid var(--tinta);box-shadow:0 6px 0 var(--tinta),0 12px 20px rgba(0,0,0,.25);font-family:"Lilita One";font-size:28px;transition:transform .1s,box-shadow .1s;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--tinta)}
.big.sec{background:var(--papel);color:var(--tinta);font-size:22px;min-height:50px;text-shadow:none}
.fila{display:flex;gap:10px;margin-top:12px}
.fila>*{flex:1}
/* ===== HUD ===== */
#hud{pointer-events:none}
#hud .barra{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 8px);display:flex;align-items:center;gap:8px;padding:0 10px}
#hud .btn-r{pointer-events:auto;width:46px;height:46px}
.riel{flex:1;height:22px;position:relative;background:var(--papel);border:2.5px solid var(--tinta);border-radius:999px;box-shadow:0 3px 0 var(--tinta)}
.riel i{position:absolute;left:6px;top:50%;height:6px;margin-top:-3px;background:var(--tomate);border-radius:3px}
.riel .cab-m{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2.5px solid var(--tinta);background:#f4c29e;overflow:hidden}
.riel .mesa{position:absolute;right:-6px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--mostaza);border:2.5px solid var(--tinta);display:grid;place-items:center;font-family:"Lilita One";font-size:14px}
.reloj{min-width:64px;height:40px;border-radius:12px;background:var(--papel);border:2.5px solid var(--tinta);box-shadow:0 3px 0 var(--tinta);display:flex;align-items:center;justify-content:center;gap:4px;font-family:"Lilita One";font-size:19px;font-variant-numeric:tabular-nums}
.reloj.oro{background:#fff2b8}
.reloj .ico{width:18px;height:18px}
#hud .cuenta{position:absolute;top:calc(var(--safe-t) + 62px);left:12px;display:flex;gap:4px;align-items:center;background:rgba(255,250,240,.92);border:2px solid var(--tinta);border-radius:999px;padding:3px 10px;font-size:14px}
.pista{position:absolute;left:50%;top:calc(var(--safe-t) + 96px);translate:-50% 0;width:min(90vw,360px);background:var(--pizarra);color:var(--tiza);border:3px solid var(--madera);outline:2.5px solid var(--tinta);border-radius:6px;padding:8px 12px;font-family:Caveat;font-size:23px;line-height:1.05;text-align:center;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .4s var(--spring)}
.pista.on{opacity:1;transform:none}
.mandos{position:absolute;left:0;right:0;bottom:0;height:calc(var(--safe-b) + 168px);display:flex;gap:10px;padding:0 10px calc(var(--safe-b) + 10px);align-items:flex-end;pointer-events:auto}
.mandos.zurdo{flex-direction:row-reverse}
.pad{position:relative;height:148px;border-radius:24px;border:3px solid var(--tinta);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .08s,background .15s;box-shadow:0 6px 0 rgba(42,26,18,.9),0 12px 24px rgba(0,0,0,.25)}
.pad .lab{font-family:"Lilita One";font-size:20px;letter-spacing:.03em}
.pad small{font-size:12px;opacity:.75;text-align:center;line-height:1.1}
#padW{flex:0 0 40%;background:linear-gradient(#fff8ea,#f3e2c2);color:var(--tinta)}
#padW .ico{width:40px;height:40px}
#padW.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(42,26,18,.9);background:linear-gradient(#ffe6a8,#f2b33d)}
#padW .flecha{position:absolute;top:8px;left:50%;translate:-50% 0;opacity:.55;width:22px;height:22px;animation:sube 1.6s ease-in-out infinite}
@keyframes sube{50%{transform:translateY(-4px)}}
#padT{flex:1;background:linear-gradient(#fff8ea,#f0dfbf);color:var(--tinta);overflow:hidden}
#padT .pista-t{position:absolute;left:14px;right:14px;top:50%;height:10px;margin-top:-5px;border-radius:5px;background:rgba(42,26,18,.15)}
#padT .pista-t::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:22px;background:rgba(42,26,18,.35)}
#padT .pomo{position:absolute;left:50%;top:50%;width:84px;height:54px;margin:-27px 0 0 -42px;display:grid;place-items:center;pointer-events:none;transition:transform .05s linear}
#padT .pomo svg{width:84px;height:54px;overflow:visible}
#padT .lab{position:absolute;top:10px}
#padT small{position:absolute;bottom:10px}
#padT.on{background:linear-gradient(#fff2cf,#f7d58a)}
.mandos .flechas{position:absolute;top:50%;left:10px;right:10px;margin-top:-12px;display:flex;justify-content:space-between;opacity:.35;pointer-events:none}
/* ===== PAUSA y RESULTADO ===== */
.tarjeta{position:absolute;left:50%;top:50%;width:min(90vw,360px);translate:-50% -50%;background:radial-gradient(120% 90% at 30% 20%,var(--pizarra2),var(--pizarra));border:10px solid var(--madera);outline:3px solid var(--tinta);border-radius:4px;padding:16px;color:var(--tiza);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.scr.on .tarjeta{animation:papel .45s var(--spring) both}
.tarjeta h3{font-family:Caveat;font-size:36px;line-height:1;margin-bottom:12px}
.tarjeta .big{margin-top:10px}
.ticketR{position:absolute;left:50%;top:calc(var(--safe-t) + 12px);bottom:calc(var(--safe-b) + 12px);width:min(92vw,390px);translate:-50% 0;display:flex;flex-direction:column}
.recibo{position:relative;flex:1;min-height:0;overflow:auto;background:var(--papel);border:3px solid var(--tinta);border-bottom:0;padding:14px 16px 12px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.scr.on .ticketR{animation:imprime .7s var(--ease) both}
@keyframes imprime{from{clip-path:inset(0 0 100% 0);transform:translateY(-30px)}to{clip-path:inset(0 0 -20px 0);transform:none}}
.recibo .rc-cab{text-align:center;border-bottom:2.5px dashed var(--tinta);padding-bottom:8px}
.recibo .rc-cab b{font-family:"Lilita One";font-weight:400;font-size:24px;display:block}
.recibo .rc-cab small{font-size:12px;color:var(--tinta2)}
.rc-cli{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.rc-cli canvas{width:64px;height:64px;flex:none;border-radius:50%;border:3px solid var(--tinta);background:radial-gradient(circle,#ffe6b8,#f2b33d)}
.globo{position:relative;flex:1;background:#fff;border:2.5px solid var(--tinta);border-radius:14px;padding:8px 10px;font-size:16px;line-height:1.2}
.globo::before{content:"";position:absolute;left:-11px;top:18px;border:7px solid transparent;border-right:9px solid var(--tinta)}
.globo::after{content:"";position:absolute;left:-7px;top:19px;border:6px solid transparent;border-right:7px solid #fff}
.lineas{font-size:15px;margin:6px 0;border-bottom:2.5px dashed var(--tinta);padding-bottom:8px}
.lin{display:flex;align-items:center;gap:6px;padding:3px 0}
.lin img{width:30px;height:30px}
.lin .p{margin-left:auto;font-variant-numeric:tabular-nums}

// ===== arte: todo dibujado con capas (contorno, sombreado, brillo) =====
const OUT = '#2a1a12';
function limb(c, a, b, w, col, outW = 2.6) {
  c.lineCap = 'round'; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
  c.strokeStyle = OUT; c.lineWidth = w + outW * 2; c.stroke(); c.strokeStyle = col; c.lineWidth = w; c.stroke();
}
function limb2(c, a, b, d, w, col) { // con articulación
  c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(d[0], d[1]);
  c.strokeStyle = OUT; c.lineWidth = w + 5.2; c.stroke(); c.strokeStyle = col; c.lineWidth = w; c.stroke();
}
function blob(c, x, y, rx, ry, fill, rot = 0, out = true, lw = 2.6) {
  c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); c.fillStyle = fill; c.fill(); if (out) { c.strokeStyle = OUT; c.lineWidth = lw; c.stroke(); }
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function fillOut(c, fill, lw = 2.6) { c.fillStyle = fill; c.fill(); c.strokeStyle = OUT; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke(); }
function shine(c, x, y, rx, ry, a = 0.55, rot = -0.5) { c.save(); c.globalAlpha *= a; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fillStyle = '#fff'; c.fill(); c.restore(); }
function lgrad(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
function rgrad(c, x, y, r0, r1, stops) { const g = c.createRadialGradient(x, y, r0, x, y, r1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }

// ---- ojos saltones ----
function drawFace(c, x, y, s, mood, lx = 0, ly = 0, blink = 0, mouthY = 1) {
  const ex = 0.42 * s, er = 0.3 * s;
  for (const sx of [-1, 1]) {
    const cx = x + sx * ex;

    const tipEl = $('#rcTip'); const t0 = performance.now(), dur = 900; const tick = () => { const k = clamp((performance.now() - t0 - d) / dur, 0, 1); tipEl.textContent = fmtEur(Math.round(r.tips * easeOut(k))); if (k < 1) requestAnimationFrame(tick); else if (r.tips) sfx('coin'); }; tick();
    if (!r.tips && !r.stars) setTimeout(() => { tipEl.textContent = '0,01 € y un caramelo'; }, 1400);
    $('#rOtra').onclick = () => { sfx('tap'); this.play(l.id); };
    if ($('#rNext')) $('#rNext').onclick = () => { sfx('tap'); this.brief(l.id + 1); };
    $('#rMapa').onclick = () => { sfx('tap'); this.fade(() => { newRun({ mode: 'menu', zone: l.z }); this.mapa(); AU.music('menu'); }); };
    if ($('#rRep')) $('#rRep').onclick = () => { sfx('tap'); this.replay(() => this.show('res')); };
    this.checkAch();
  },
  onRushEnd(r) {
    if (!r || G.mode !== 'rush' || G.result !== r) return;
    if (r.record) SAVE.best.rush = r.tables; SAVE.tips += r.tips; SAVE.totalTips += r.tips; store();
    const fell = G.firstDropT !== undefined;
    const go = () => {
      $('#recibo').innerHTML = `<div class="rc-cab"><b>HORA PUNTA</b><small>${ZONES[G.zone].n} · turno terminado</small></div>
        <div class="rc-cli"><canvas id="rcCv"></canvas><div class="globo">${r.tables >= 10 ? '¡Manolo, eres una máquina! Bueno, una máquina rota.' : r.tables >= 4 ? 'No está mal. Mi abuela sirve más, pero tiene 90 años.' : 'Pepe dice que mañana no hace falta que vengas.'}</div></div>
        <div class="lineas"><div class="lin"><span>Mesas servidas</span><span class="p">${r.tables}</span></div><div class="lin"><span>Platos entregados</span><span class="p">${r.served}</span></div><div class="lin"><span>Distancia</span><span class="p">${r.dist} m</span></div><div class="lin"><span>Récord</span><span class="p">${Math.max(r.best, r.tables)}${r.record ? ' · ¡NUEVO!' : ''}</span></div><div class="lin tot"><span>Propina</span><span class="p">${fmtEur(r.tips)}</span></div></div>
        <div class="narr">${r.record ? '¡Récord nuevo! Pepe ha llorado. De pena, pero ha llorado.' : pick(TXT.narrDisaster)}</div>`;
      $('#resPie').innerHTML = `<div class="fila"><button class="big" id="rOtra">${svg('otra')}Otra vez</button></div><div class="fila">${fell && G.snaps.length > 30 ? `<button class="big sec" id="rRep">${svg('tele')}Repetición</button>` : ''}<button class="big sec" id="rMapa">${svg('casa')}Menú</button></div>`;
      this.show('res'); requestAnimationFrame(() => drawClientCv($('#rcCv'), 'paco', r.tables >= 4 ? 'happy' : 'worried'));
      $('#rOtra').onclick = () => { sfx('tap'); this.rush(); };
      $('#rMapa').onclick = () => { sfx('tap'); this.menu(); };
      if ($('#rRep')) $('#rRep').onclick = () => { sfx('tap'); this.replay(() => this.show('res')); };
      if (r.record) sfx('cheer'); this.checkAch();
    };
    if (fell && G.snaps.length > 30) this.replay(go); else go();
  },
  // ---------- REPETICIÓN ----------
  replay(done) {
    const t0 = (G.firstDropT || G.t) - 1.1, t1 = Math.min(G.snaps[G.snaps.length - 1].t, (G.firstDropT || G.t) + 2.4);
    const frames = G.snaps.filter(s => s.t >= t0 && s.t <= t1); if (frames.length < 10) { done(); return; }
    this.show('replay'); sfx('ooh');
    const fl = G.replayItem; const D = fl ? ITEMS[fl] : null;
    const lines = [pick(TXT.replay)]; if (D) lines.push(pick(TXT.replayItem).replace('{art}', D.art).replace('{Art}', cap(D.art)).replace('{n}', D.n).replace('{o}', D.art === 'el' || D.art === 'los' ? 'o' : 'a'));
    $('#repSub').textContent = lines[0];
    G.replay = { frames, i: 0, speed: 0.35, lines, done: () => { G.replay = null; done(); } };
    const skip = () => { if (G.replay) G.replay.done(); };
    $('#replay').onclick = skip;
  },
  // ---------- VESTUARIO ----------
  vest(tab = 'hat') {
    this.vTab = tab; $('#vBote').textContent = fmtEur(SAVE.tips);
    $$('#vTabs button').forEach(b => { b.classList.toggle('on', b.dataset.t === tab); b.onclick = () => { sfx('tap'); this.vest(b.dataset.t); }; });
    const cat = tab === 'hat' ? HATS : tab === 'stache' ? STACHES : TRAYS; const rej = $('#vRej'); rej.innerHTML = '';
    for (const k in cat) {
      const it = cat[k]; const own = SAVE.owned[tab].includes(k), eq = SAVE.eq[tab] === k;
      const d = el('div', 'prenda'); const cv = el('canvas'); d.appendChild(cv);
      d.insertAdjacentHTML('beforeend', `<b>${it.n}</b><small>${it.d}</small>`);
      const b = el('button', 'acc ' + (eq ? 'puesto' : own ? 'poner' : SAVE.tips >= it.p ? '' : 'caro'), eq ? svg('ok') + 'Puesto' : own ? 'Ponérmelo' : fmtEur(it.p));
      b.onclick = () => {
        if (eq) return; if (own) { SAVE.eq[tab] = k; sfx('pop'); }
        else if (SAVE.tips >= it.p) { SAVE.tips -= it.p; SAVE.owned[tab].push(k); SAVE.eq[tab] = k; sfx('coin'); sfx('cheer'); }
        else { sfx('honk'); b.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], { duration: 200 }); return; }
        store(); this.vest(tab); this.checkAch();
      };
      d.appendChild(b); rej.appendChild(d);
      requestAnimationFrame(() => { cv.width = 172; cv.height = 140; const x = cv.getContext('2d'); x.translate(86, tab === 'tray' ? 96 : 84); if (tab === 'tray') { x.scale(1.3, 1.3); drawTray(x, k, 46); x.translate(0, -7); drawItem(x, 'tortilla', { t: 0.4 }); } else { x.scale(1.45, 1.45); drawHeadPreview(x, tab === 'hat' ? k : SAVE.eq.hat, tab === 'stache' ? k : SAVE.eq.stache); } });
    }
    this.show('vest'); this.vestScene();
  },
  vestScene() {
    const cv = $('#vCv'); const r = cv.getBoundingClientRect(); const d = 2; cv.width = r.width * d; cv.height = r.height * d; const x = cv.getContext('2d');
    const draw = () => {
      if (this.cur !== 'vest') return; const t = performance.now() / 1000;
      x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.setTransform(d * 0.78, 0, 0, d * 0.78, cv.width / 2 - 10, cv.height - 26);
      const sv = G.man.x; const P = (() => { const m = G.man; const bk = { x: m.x, v: m.v, ph: m.ph, danger: m.danger }; m.x = 0; m.v = 0; m.ph = 0; m.danger = 0; poseWalk(0); const P = cloneP(m.P); Object.assign(m, bk); return P; })();
      blob(x, 0, 2, 70, 8, 'rgba(0,0,0,.18)', 0, false);
      drawManolo(x, P, { mood: 'happy', t, hat: SAVE.eq.hat, stache: SAVE.eq.stache, blink: (t % 3.2) > 3.05 ? 1 : 0, look: [0.4, -0.3], noShadow: 1, trayArm: 1 });
      x.save(); x.translate(P.hR[0] + 6, P.hR[1] - 4); drawTray(x, SAVE.eq.tray, 46); x.translate(0, -7); drawItem(x, 'paella', { t }); x.translate(0, -16); drawItem(x, 'tortilla', { t }); x.translate(0, -22); drawItem(x, 'cana', { t }); x.restore();
      requestAnimationFrame(draw);
    }; draw();
  },
  // ---------- LOGROS ----------
  logros() {
    const L = $('#lLista'); L.innerHTML = ''; let n = 0;
    for (const a of ACH) { const ok = !!SAVE.ach[a.id]; if (ok) n++; L.insertAdjacentHTML('beforeend', `<div class="logro ${ok ? '' : 'no'}"><div class="med">${svg(a.i)}</div><div><b>${a.n}</b><small>${a.d}</small></div></div>`); }
    const S = SAVE.stats; L.insertAdjacentHTML('beforeend', `<p class="texto">Historial de Manolo: ${S.plays} turnos, ${S.served} mesas servidas, ${S.broken} cosas rotas, ${S.falls} caídas de morros, ${S.pigeons} palomas transportadas y ${S.faceSplat} platos servidos directamente a la cara.</p>`);
    $('#lCnt').textContent = n + '/' + ACH.length; this.show('logros');
  },
  // ---------- AJUSTES ----------
  ajustes() {
    const A = $('#aLista'); A.innerHTML = '';
    const sw = (k, ico, txt) => { const b = el('button', 'ajuste' + (SAVE.opt[k] ? ' on' : ''), `${svg(ico)}<span>${txt}</span><span class="sw"></span>`); b.onclick = () => { SAVE.opt[k] = SAVE.opt[k] ? 0 : 1; store(); AU.applyOpts(); b.classList.toggle('on', !!SAVE.opt[k]); sfx('tap'); if (k === 'vib') vib(30); }; A.appendChild(b); };
    sw('sfx', 'sonido', 'Efectos de sonido'); sw('music', 'musica', 'Música de verbena'); sw('vib', 'vibra', 'Vibración'); sw('zurdo', 'mano', 'Mandos al revés (zurdos)');
    const r = el('button', 'ajuste peligro', `${svg('basura')}<span>Borrar todo el progreso</span>`); let armed = false;
    r.onclick = () => { if (!armed) { armed = true; r.querySelector('span').textContent = 'Toca otra vez para borrarlo todo'; sfx('honk'); setTimeout(() => { armed = false; r.querySelector('span').textContent = 'Borrar todo el progreso'; }, 3000); return; } localStorage.removeItem(SAVE_KEY); loadSave(); sfx('crash'); this.menu(); };
    A.appendChild(r);
    A.insertAdjacentHTML('beforeend', `<p class="texto">«¡Marchando!» · versión ${VERSION}. Todo está dibujado y sonando en directo con código: no hay ni una imagen ni un sonido grabado. Ningún camarero real ha sufrido daños. Las palomas, en cambio, sí que son reales.</p>`);
    this.show('ajustes');
  },
};
function drawHeadPreview(x, hat, stache) {
  const P = { hip: [0, 80], neck: [0, 28], head: [0, 0], kL: [0, 120], fL: [0, 160], kR: [0, 120], fR: [0, 160], eL: [0, 60], hL: [0, 90], eR: [0, 60], hR: [0, 90] };
  x.save(); x.beginPath(); x.rect(-60, -60, 120, 96); x.clip(); drawManolo(x, P, { mood: 'happy', t: 0, hat, stache, noShadow: 1, look: [0.4, -0.2] }); x.restore();
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ===== bucle principal, controles y arranque =====
const VERSION = '4';
let acc = 0, lastTs = 0, frameN = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  if (G.replay) {
    const R = G.replay; R.i += dt * 60 * R.speed; const f = R.frames[Math.min(R.frames.length - 1, Math.floor(R.i))];
    render(f);
    if (R.lines[1] && R.i > R.frames.length * 0.45) $('#repSub').textContent = R.lines[1];
    if (R.i >= R.frames.length + 25) R.done();
    return;
  }
  if (G.mode !== 'none' && !G.paused) {
    let sdt = dt; if (G.slowT > 0) { G.slowT -= dt; sdt = dt * 0.3; }
    acc += sdt; let n = 0; while (acc >= DT && n < 8) { stepGame(DT); acc -= DT; n++; } if (n === 8) acc = 0;
  }
  if (G.mode === 'none') return;
  const S = makeSnap(); render(S);
  if ((G.mode === 'level' || G.mode === 'rush') && !G.paused) { G.snaps.push(S); if (G.snaps.length > 420) G.snaps.shift(); }
  UI.hud(dt);
  if (UI.cur === 'menu' && (++frameN % 20 === 0)) UI.layoutMenu();
}
// ---- controles táctiles ----
function setupPads() {
  const W = $('#padW'), T = $('#padT'); let wId = null, wY = 0, tId = null, tX = 0;
  W.addEventListener('pointerdown', e => { e.preventDefault(); AU.init(); wId = e.pointerId; W.setPointerCapture(e.pointerId); wY = e.clientY; G.input.walk = true; W.classList.add('on'); });
  W.addEventListener('pointermove', e => { if (e.pointerId !== wId) return; if (wY - e.clientY > 34) { G.input.jump = true; wY = e.clientY - 1000; } });
  const wUp = e => { if (e.pointerId !== wId) return; wId = null; G.input.walk = false; W.classList.remove('on'); };
  W.addEventListener('pointerup', wUp); W.addEventListener('pointercancel', wUp);
  T.addEventListener('pointerdown', e => { e.preventDefault(); AU.init(); tId = e.pointerId; T.setPointerCapture(e.pointerId); tX = e.clientX; T.classList.add('on'); });
  T.addEventListener('pointermove', e => { if (e.pointerId !== tId) return; G.input.tilt = clamp((e.clientX - tX) / 70, -1, 1); });
  const tUp = e => { if (e.pointerId !== tId) return; tId = null; G.input.tilt = 0; T.classList.remove('on'); };
  T.addEventListener('pointerup', tUp); T.addEventListener('pointercancel', tUp);
  // teclado (ordenador)
  const K = {};
  const upd = () => { if (tId === null) G.input.tilt = (K.ArrowRight ? 1 : 0) - (K.ArrowLeft ? 1 : 0); };
  addEventListener('keydown', e => { if (UI.cur !== 'hud') return; K[e.code] = 1; if (e.code === 'Space' || e.code === 'KeyW') G.input.walk = true; if (e.code === 'ArrowUp') G.input.jump = true; if (e.code === 'Escape') UI.pause(true); upd(); });
  addEventListener('keyup', e => { K[e.code] = 0; if (e.code === 'Space' || e.code === 'KeyW') G.input.walk = false; upd(); });
}
function boot() {
  resize(); addEventListener('resize', resize);
  // bombillas del letrero
  const bb = $('#bombillas');
  for (let i = 0; i < 12; i++) { const b = el('b'); b.style.left = (4 + i * 8.3) + '%'; b.style.top = '-5px'; bb.appendChild(b); const c = el('b'); c.style.left = (4 + i * 8.3) + '%'; c.style.bottom = '-5px'; bb.appendChild(c); }
  for (let i = 0; i < 3; i++) for (const s of ['left', 'right']) { const b = el('b'); b.style[s] = '-5px'; b.style.top = (22 + i * 26) + '%'; bb.appendChild(b); }
  setupPads();
  const first = () => { AU.init(); if (UI.cur === 'menu') AU.music('menu'); else if (G.mode === 'level' || G.mode === 'rush') AU.music(ZONES[G.zone].song); removeEventListener('pointerdown', first); };
  addEventListener('pointerdown', first);
  $('#bJugar').onclick = () => { sfx('tap'); UI.mapa(); };
  $('#bRush').onclick = () => { sfx('tap'); if (!starsOf(3)) { UI.toast('Hora punta cerrada', 'Termina la mesa 4 del bar para que Pepe te deje.'); return; } UI.rush(); };
  $('#bVest').onclick = () => { sfx('tap'); UI.vest(); };
  $('#bLogros').onclick = () => { sfx('tap'); UI.logros(); };
  $('#bAjustes').onclick = () => { sfx('tap'); UI.ajustes(); };
  $$('[data-back]').forEach(b => b.onclick = () => { sfx('tap'); UI.menu(); });
  $('#brief .velo').onclick = () => UI.show('mapa');
  $('#bPausa').onclick = () => { sfx('tap'); UI.pause(true); };
  $('#pSeguir').onclick = () => { sfx('tap'); UI.pause(false); };
  $('#pOtra').onclick = () => { sfx('tap'); G.paused = false; if (G.mode === 'rush') UI.rush(); else UI.play(G.lv.id); };
  $('#pSalir').onclick = () => { sfx('tap'); G.paused = false; if (G.mode === 'rush') UI.menu(); else UI.fade(() => { newRun({ mode: 'menu', zone: G.zone }); UI.mapa(); AU.music('menu'); }); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && UI.cur === 'hud' && !G.over) UI.pause(true); });
  // instalar como app
  let dp = null; addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; $('#bInstalar').classList.add('on'); });
  $('#bInstalar').onclick = async () => { if (!dp) return; dp.prompt(); await dp.userChoice; dp = null; $('#bInstalar').classList.remove('on'); };
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) navigator.serviceWorker.register('sw.js').catch(() => { });
  requestAnimationFrame(frame);
  const go = () => { const c = $('#carga'); c.style.opacity = 0; setTimeout(() => c.style.display = 'none', 400); UI.menu(); };
  const fr = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  fr.then(go);
  window.__m = { G, UI, newRun, stepGame, LEVELS, SAVE, makeSnap, render };
}
boot();
