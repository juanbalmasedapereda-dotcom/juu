*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14173a;color:#fff;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--gold:#ffd88a;--glass:rgba(22,26,64,.55);--line:rgba(255,255,255,.16)}
.glass{background:linear-gradient(180deg,rgba(52,56,130,.46),rgba(24,28,80,.38));backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);box-shadow:0 10px 30px rgba(5,8,30,.35),inset 0 1px 0 rgba(255,255,255,.18)}

/* ===== MENÚ ===== */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;padding-top:calc(var(--st) + 4vh)}
#menu>*{pointer-events:auto}
.title{text-align:center;margin-top:1vh;animation:dropIn .9s cubic-bezier(.2,1.4,.4,1) both}
.title .t1{font-weight:900;font-size:14px;letter-spacing:.62em;padding-left:.62em;color:#fff3d6;text-shadow:0 2px 0 rgba(120,50,60,.5)}
.title .t2{position:relative;display:inline-block;font:italic 700 clamp(52px,16vw,72px)/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;color:#fff4dc;text-shadow:0 2px 0 #f0a46a,0 4px 0 #b8624a,0 12px 22px rgba(30,10,60,.45);padding:0 .08em;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-1deg)}}
.title .t3{margin-top:6px;font-size:14px;color:#e9ecff;opacity:.85;text-shadow:0 1px 6px rgba(0,0,30,.6)}
@keyframes shine{0%{background-position:150% 0}45%,100%{background-position:-60% 0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes upIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
#mbottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(var(--sb) + 16px);display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:480px;margin:0 auto}
.bigplay{position:relative;overflow:hidden;height:66px;border-radius:22px;background:linear-gradient(180deg,#ffd97f 0%,#ffae52 55%,#f7853a 100%);color:#3a1604;font-weight:900;font-size:24px;letter-spacing:.02em;box-shadow:0 6px 0 #b9562a,0 14px 24px rgba(40,10,40,.35),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -4px 0 rgba(160,70,20,.35);display:flex;align-items:center;justify-content:center;gap:12px;animation:upIn .7s .25s cubic-bezier(.2,1.2,.4,1) both;transition:transform .12s}
.bigplay small{display:block;font-size:12.5px;font-weight:800;opacity:.9;letter-spacing:.04em}
.bigplay .pl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45);display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(160,70,20,.25)}
.bigplay::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:sweep 3.2s 1.4s ease-in-out infinite}
@keyframes sweep{0%{left:-80px}35%,100%{left:120%}}
button:active{transform:scale(.96)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{position:relative;overflow:hidden;border-radius:18px;padding:11px 12px 11px 56px;min-height:60px;text-align:left;animation:upIn .7s cubic-bezier(.2,1.2,.4,1) both;transition:transform .12s}
.mode:nth-child(1){animation-delay:.35s}.mode:nth-child(2){animation-delay:.42s}
.mode b{display:block;font-size:16px}
.mode span{display:block;font-size:12px;opacity:.78;margin-top:2px;line-height:1.2}
.mode i{position:absolute;left:10px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:21px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.25)}
.mode.daily i{background:linear-gradient(160deg,#ffe58a,#ff9f4a)}
.mode.zen i{background:linear-gradient(160deg,#9ff0c4,#3fb68a)}
.mode .badge{position:absolute;top:-1px;right:-1px;border-radius:0 17px 0 10px!important;font-size:10px;font-weight:800;background:#ff6b6b;color:#fff;border-radius:8px;padding:2px 6px;box-shadow:0 2px 6px rgba(255,80,80,.5)}
.iconrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;animation:upIn .7s .5s cubic-bezier(.2,1.2,.4,1) both}
.ib{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:16px;font-size:11.5px;font-weight:700;position:relative;transition:transform .12s;min-height:62px}
.ib svg{width:26px;height:26px}
.ib .dot{position:absolute;top:6px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 0 2px rgba(20,20,50,.6)}
.rec{text-align:center;font-size:12.5px;color:#fff;opacity:.85;text-shadow:0 1px 4px rgba(0,0,30,.7);animation:upIn .7s .55s both}
.rec b{color:var(--gold)}
#installBtn{border-radius:14px;height:44px;font-weight:800;font-size:14px}

/* ===== HUD ===== */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{border-radius:16px;padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;min-width:76px}
.pill .lbl{font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.7}
.pill .val{font-size:22px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.pill .val.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.22);color:var(--gold)}}
#quests{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center;min-width:0}
.qchip{display:flex;align-items:center;gap:7px;border-radius:14px;padding:4px 10px 4px 4px;font-size:12.5px;font-weight:700;max-width:100%;animation:chipIn .45s cubic-bezier(.2,1.4,.4,1) both;white-space:nowrap}
.qchip .em{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.qchip .bar{width:38px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;flex:none}
.qchip .bar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.qchip.done{animation:chipOut .8s forwards}
.qchip.fail{animation:chipFail .9s forwards}
@keyframes chipIn{from{opacity:0;transform:translateY(-14px) scale(.8)}}
@keyframes chipOut{30%{transform:scale(1.15);background:rgba(120,255,170,.4)}100%{opacity:0;transform:scale(.6)}}
@keyframes chipFail{30%{background:rgba(255,90,90,.45)}100%{opacity:0;transform:translateX(20px)}}
.rbtn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none}
.rbtn svg{width:22px;height:22px}
.rbtn.dis{opacity:.4}
#hud .rbtn+.rbtn{margin-left:-2px}

/* ===== BANDEJA ===== */
#tray{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(var(--sb) + 12px);display:flex;align-items:flex-end;justify-content:center;gap:10px;pointer-events:none}
#tray>*{pointer-events:auto}
.nextbox{width:64px;height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nextbox canvas{width:48px;height:48px}
.nextbox .cnt{font-size:12px;font-weight:900;display:flex;align-items:center;gap:3px}
.nextbox .cnt.low{color:#ff9a8a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.curbox{width:118px;height:118px;border-radius:30px;display:grid;place-items:center;position:relative}
.curbox canvas{width:104px;height:104px;transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.curbox .qtag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:11px;background:linear-gradient(180deg,#fff,#ffeccd);color:#5a3410;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.curbox.empty::after{content:"";}
.acts{display:flex;flex-direction:column;gap:8px}
.act{width:64px;height:54px;border-radius:18px;display:grid;place-items:center;transition:transform .12s,opacity .2s}
.act svg{width:26px;height:26px}
.act.ok{background:linear-gradient(180deg,#8ff0a8,#33c06a);box-shadow:0 8px 20px rgba(40,200,110,.45),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,90,40,.3);color:#063b1a}
.act.ok.dis{filter:grayscale(1) brightness(.75);opacity:.55;box-shadow:none}
.act.ok.ready{animation:okPulse 1.2s infinite}
@keyframes okPulse{50%{box-shadow:0 8px 30px rgba(60,255,140,.8),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,90,40,.3)}}
#coach{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(var(--sb) + 150px);width:min(330px,calc(100% - 32px));border-radius:18px;padding:12px 14px 12px 52px;font-size:14px;line-height:1.35;font-weight:600;pointer-events:none;animation:upIn .4s both;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,244,222,.96));color:#3b2a1a;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#coach::before{content:"🕊️";position:absolute;left:12px;top:50%;margin-top:-15px;font-size:26px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
#toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 196px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{border-radius:16px;padding:7px 12px 7px 10px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,240,214,.97));color:#3b2a1a;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:toastIn .5s cubic-bezier(.2,1.4,.4,1) both,toastOut .5s 2.8s forwards}
.toast .em{font-size:24px;flex:none;animation:bob 1.2s ease-in-out infinite}
.toast b{display:block;font-size:13.5px}
.toast span{display:block;font-size:11.5px;opacity:.85;margin-top:1px}
.toast .rw{margin-left:auto;flex:none;font-weight:900;font-size:13px;color:#1a7a43;background:#d9f7e4;border-radius:10px;padding:4px 8px}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.85)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px) scale(.95)}}

/* ===== PANELES ===== */
.panel{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(60,50,130,.75),rgba(10,12,35,.92));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;animation:fadeIn .25s both;z-index:5}
@keyframes fadeIn{from{opacity:0}}
.phead{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 12px) 14px 10px}
.phead h2{flex:1;margin:0;font:italic 700 30px/1.1 Fraunces,Georgia,serif;color:#fff1d6;text-shadow:0 2px 0 rgba(140,60,50,.6)}
.phead .sub{font-size:12px;opacity:.75;font-weight:700}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--sb) + 20px);touch-action:pan-y}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ccard{border-radius:16px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;animation:upIn .45s both}
.ccard .med{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.3)}
.ccard .med::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.ccard.lock .med{filter:grayscale(1) brightness(.5)}
.ccard.lock .med span{filter:brightness(0);opacity:.5}
.ccard .nm{font-size:10.5px;font-weight:700;line-height:1.15;min-height:24px;display:flex;align-items:center}
.sect{font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.7;margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.ach{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 12px;margin-bottom:8px;animation:upIn .45s both}
.ach .med{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(160deg,#ffe9a6,#f2a64a);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(120,60,10,.3),0 0 18px rgba(255,200,100,.35)}
.ach.lock .med{background:linear-gradient(160deg,#5b5f86,#363a5e);box-shadow:inset 0 2px 0 rgba(255,255,255,.15);filter:grayscale(.6)}
.ach b{display:block;font-size:14.5px}
.ach span{display:block;font-size:12px;opacity:.75;margin-top:2px}
.ach .prog{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.ach .prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd88a,#ff9f4a)}
.ach .tx{flex:1;min-width:0}
.skin{display:flex;align-items:center;gap:12px;border-radius:18px;padding:10px;margin-bottom:10px;position:relative;width:100%;text-align:left;animation:upIn .45s both}
.skin canvas{width:84px;height:84px;flex:none}
.skin b{display:block;font-size:17px}
.skin span{display:block;font-size:12.5px;opacity:.8;margin-top:3px}
.skin.sel{border-color:rgba(255,216,138,.9);box-shadow:0 0 0 2px rgba(255,216,138,.6),0 10px 26px rgba(255,180,80,.25)}
.skin.lock canvas{filter:saturate(.55) brightness(.7)}
.skin .tag{position:absolute;right:12px;top:12px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:9px;background:var(--gold);color:#4a2b08}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:16px;padding:12px 14px;margin-bottom:8px;min-height:56px}
.row b{font-size:15px}.row span{display:block;font-size:12px;opacity:.7;font-weight:500}
.tog{width:56px;height:32px;border-radius:16px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .2s cubic-bezier(.2,1.4,.4,1)}
.tog.on{background:linear-gradient(90deg,#4fd88a,#2fb56b)}.tog.on::after{left:27px}
.dbtn{height:44px;padding:0 16px;border-radius:14px;font-weight:800;font-size:14px}
.dbtn.red{background:rgba(255,90,90,.2);border:1px solid rgba(255,120,120,.5);color:#ffc2c2}
.how{border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.45;margin-bottom:8px}
.how b{color:var(--gold)}

/* pausa y fin */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,30,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:6;animation:fadeIn .25s both;padding:16px}
.card{width:min(360px,100%);border-radius:28px;padding:22px 18px 18px;text-align:center;animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both;background:linear-gradient(180deg,rgba(60,56,140,.92),rgba(26,28,70,.94));border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
@keyframes popIn{from{opacity:0;transform:scale(.8) translateY(30px)}}
.card h3{margin:0 0 4px;font:italic 700 32px/1.1 Fraunces,Georgia,serif;color:#fff1d6;text-shadow:0 2px 0 rgba(140,60,50,.6)}
.card .sub{font-size:13px;opacity:.75}
.big{font-size:54px;font-weight:900;margin:8px 0 2px;font-variant-numeric:tabular-nums;color:#ffd68a;text-shadow:0 3px 0 rgba(140,60,30,.55)}
.newrec{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.1em;padding:4px 10px;border-radius:10px;background:linear-gradient(90deg,#ff7a7a,#ffb35a);color:#fff;animation:wig 1s infinite;margin-bottom:6px}
@keyframes wig{50%{transform:rotate(-4deg) scale(1.06)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{border-radius:14px;padding:8px 4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;opacity:.7}
.newc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 10px}
.newc div{font-size:24px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);animation:popIn .5s both}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.btn{height:52px;border-radius:17px;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn.pri{background:linear-gradient(180deg,#ffd97f,#f7903f);color:#4a2308;box-shadow:0 8px 22px rgba(255,140,60,.4),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(160,70,20,.3)}
.btn.sec{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.minirow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.minirow .tbtn{width:52px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.minirow .tbtn.off{opacity:.4}
#mEnd{align-items:flex-end;background:linear-gradient(180deg,rgba(8,10,30,0) 0%,rgba(8,10,30,0) 30%,rgba(8,10,30,.6) 60%);backdrop-filter:none;-webkit-backdrop-filter:none;padding-bottom:calc(var(--sb) + 14px)}
#mEnd .card{padding:16px 16px 14px}#mEnd .big{font-size:46px;margin:4px 0 0}#mEnd .stats{margin:8px 0}#mEnd .btns{flex-direction:row;flex-wrap:wrap}#mEnd .btn{flex:1 1 28%;height:48px;font-size:14.5px;padding:0 6px}#mEnd .btn.pri{flex-basis:100%}
#mPost{z-index:7}.card.post{padding:12px}.card.post img{display:block;width:100%;border-radius:18px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;box-shadow:0 10px 24px rgba(0,0,0,.4);max-height:62vh;object-fit:contain}.card.post .sub{margin:8px 0 2px}.btns.row2{flex-direction:row}.btns.row2 .btn{flex:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
@media (max-height:700px){.rec{display:none}#mEnd .stats{display:none}#mEnd .sub{font-size:12px}#mEnd h3{font-size:26px}}
@media (max-height:640px){.title .t2{font-size:48px}.bigplay{height:58px}.mode{min-height:54px}.curbox{width:104px;height:104px}.curbox canvas{width:92px;height:92px}}
@media (max-width:360px){.mode{padding-left:50px}.mode i{width:32px;height:32px;margin-top:-16px;font-size:18px}.mode span{font-size:11px}}

/* ===== Tema «cuento»: papel crema y tinta ===== */
:root{--ink:#3b2a1a;--ink2:#7a5534;--paper:#fff8ea;--paper2:#f5e4c6;--edge:rgba(122,80,40,.28)}
.glass{background:linear-gradient(180deg,var(--paper),var(--paper2));backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--edge);color:var(--ink);box-shadow:0 3px 0 rgba(150,100,50,.35),0 10px 22px rgba(20,16,50,.28),inset 0 1px 0 #fff}
.pill .lbl{color:var(--ink2);opacity:1}
.pill .val{color:var(--ink)}
.rbtn svg *{stroke:var(--ink)}.rbtn svg rect{fill:var(--ink);stroke:none}
#bRot svg path{stroke:var(--ink)}
.ib svg{stroke:#9a531f}.ib svg path[fill^="rgba"]{fill:rgba(255,170,80,.35)}
.ib{color:var(--ink)}
.mode span{color:var(--ink2);opacity:1}
.qchip .bar{background:rgba(110,70,30,.15)}
.qchip .tx{color:var(--ink)}
.curbox,.nextbox{background:radial-gradient(circle at 50% 40%,#fffdf6,#f3dfbd)}
.nextbox .cnt{color:var(--ink)}
.tog{background:rgba(110,70,30,.2)}
.how b{color:#b5541c}
.ach span,.skin span,.row span{color:var(--ink2);opacity:1}
.ach.lock .med{background:linear-gradient(160deg,#d9cdb8,#b8a78c)}
.ach .prog{background:rgba(110,70,30,.15)}
.ccard .nm{color:var(--ink)}
.ccard.lock .med{filter:grayscale(.8) brightness(.85)}
.skin.sel{border-color:#e08a3c;box-shadow:0 0 0 3px #f2a65a,0 10px 22px rgba(20,16,50,.3)}
.panel{background:radial-gradient(120% 80% at 50% 0%,#3d4594,#151838 75%)}
.sect{color:#ffe9c4;opacity:.85}.sect::after{background:rgba(255,233,196,.25)}
.card{background:linear-gradient(180deg,#fffaf0,#f3e0bf);color:var(--ink);border:1px solid var(--edge);box-shadow:0 5px 0 rgba(150,100,50,.4),0 26px 60px rgba(0,0,0,.45),inset 0 1px 0 #fff}
.card h3{color:#4a2a14;text-shadow:0 2px 0 rgba(255,255,255,.8)}
.card .sub{color:var(--ink2);opacity:1}
.big{color:#e2742c;text-shadow:0 3px 0 rgba(150,70,20,.25)}
.stat{background:rgba(120,80,40,.08);border-color:rgba(120,80,40,.16)}.stat span{color:var(--ink2);opacity:1}
.newc div{background:rgba(120,80,40,.1)}
.btn.sec{background:rgba(120,80,40,.1);border-color:rgba(120,80,40,.24);color:var(--ink)}
.minirow .tbtn{background:rgba(120,80,40,.1);border-color:rgba(120,80,40,.22)}
.dbtn.red{background:#ffe2dc;border-color:#e88b7a;color:#a3321e}
#mEnd .card{background:linear-gradient(180deg,rgba(255,250,240,.97),rgba(243,224,191,.97))}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu">
  <div class="title"><div class="t1">ISLA</div><div class="t2">Celeste</div><div class="t3">Construye tu isla entre las nubes</div></div>
  <div id="mbottom">

    <div class="modes">

      <button class="mode zen glass" id="bZen"><i><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z" fill="#effff6"/><path d="M5 19 13.5 10.5" stroke="#3fb68a" stroke-width="2" stroke-linecap="round"/></svg></i><b>Zen</b><span>Sin límite, sin prisa</span></button>
    </div>
    <div class="iconrow">

  const w=world,n=w.tiles.length*6;PAR=new Int32Array(n);for(let i=0;i<n;i++)PAR[i]=i;

  for(const t of w.tiles)for(let i=0;i<6;i++){const r=fnd(t.id*6+i);let s=sets.get(r);if(!s){s=new Set();sets.set(r,s);}s.add(t.id);if(!w.map.get(key(t.q+DIRS[i][0],t.r+DIRS[i][1])))open.set(r,1);}

 {i:'🦄',n:'Arca completa',d:'Las 20 criaturas del álbum.',c:()=>Object.keys(S.album).length>=20,p:()=>Object.keys(S.album).length/20},

];
function checkAch(){for(let i=0;i<ACH.length;i++){if(S.ach[i])continue;let ok=false;try{ok=ACH[i].c();}catch(e){}if(ok){S.ach[i]=1;S.seenAch=0;achToast(ACH[i]);}}}
function achToast(a){toast(a.i,'Logro: '+a.n,a.d,'🏆');if(S.set.snd)tone(1046,.3,'triangle',.08,.0),tone(1568,.5,'sine',.07,.1);}

// ===== Pantallas
function showScene(s){scene=s;
  $('#menu').classList.toggle('hide',s!=='menu');$('#hud').classList.toggle('hide',s!=='game');$('#tray').classList.toggle('hide',s!=='game');
  if(s!=='game')$('#coach').classList.add('hide');
  camYF=s==='menu'?.39:s==='view'?.46:.5;
  if(s==='game'){$('#quests').innerHTML='';}
}
function hideGameUi(){$('#hud').classList.add('hide');$('#tray').classList.add('hide');$('#coach').classList.add('hide');}
let demo=null;
function goMenu(){G=null;demo=demo||buildDemo();world=demo;world.cand=null;cam.tx=0;cam.ty=0;cam.tz=menuZoom();showScene('menu');refreshMenu();const vb=$('#viewBack');if(vb)vb.remove();}
function menuZoom(){return clamp(Math.min(W/300,(H*.33)/190),.7,2.1);}
function refreshMenu(){
  $('#mrec').innerHTML=S.best?`Récord: <b>${fmt(S.best)}</b> · Criaturas: <b>${Object.keys(S.album).length}/20</b>`:'Coloca losetas, une paisajes y da hogar a 20 criaturas';
  const dOk=S.daily.d===todayStr()&&S.daily.best>0;$('#dailyTxt').textContent=dOk?'Hoy: '+fmt(S.daily.best)+' pts':'Las mismas losetas para todos';
  let b=$('#bDaily').querySelector('.badge');if(!dOk&&!b){b=document.createElement('span');b.className='badge';b.textContent='NUEVO';$('#bDaily').appendChild(b);}if(dOk&&b)b.remove();
  $('#dotAlbum').classList.toggle('hide',!!S.seenAlb||!Object.keys(S.album).length);$('#dotAch').classList.toggle('hide',!!S.seenAch||!Object.keys(S.ach).length);$('#dotSkin').classList.toggle('hide',!!S.seenSkin);
}
function openPanel(id){sfx.ui();const p=$(id);p.classList.remove('hide');}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{sfx.ui();b.closest('.panel').classList.add('hide');refreshMenu();});
function terrBg(t){return`linear-gradient(160deg,${shade(TCOL[t],.35)},${shade(TCOL[t],-.15)})`;}
function openAlbum(){
  const got=Object.keys(S.album).length;$('#albCount').textContent=got+'/20';let h='';
  for(let t=0;t<5;t++){h+=`<div class="sect">${TNs[t].toUpperCase()}</div><div class="grid4">`;CR.forEach((c,i)=>{if(c.t!==t)return;const has=S.album[i];h+=`<div class="ccard glass ${has?'':'lock'}" style="animation-delay:${i*.025}s"><div class="med" style="background:${terrBg(t)}"><span>${c.e}</span></div><div class="nm">${has?c.n:'???'}</div></div>`;});h+='</div>';}
  h+=`<div class="how glass" style="margin-top:14px">Las criaturas aparecen en algunas losetas y piden una región de su terreno. Haz que llegue al número que piden <b>antes de que se cierre</b> y se mudarán a tu isla.</div>`;
  $('#albBody').innerHTML=h;S.seenAlb=1;save();openPanel('#pAlbum');
}
function openAch(){let n=0;let h='';ACH.forEach((a,i)=>{const has=S.ach[i];if(has)n++;let p='';if(!has&&a.p){p=`<div class="prog"><i style="width:${Math.min(100,a.p()*100)}%"></i></div>`;}h+=`<div class="ach glass ${has?'':'lock'}" style="animation-delay:${i*.03}s"><div class="med">${has?a.i:'🔒'}</div><div class="tx"><b>${a.n}</b><span>${a.d}</span>${p}</div></div>`;});$('#achCount').textContent=n+'/'+ACH.length;$('#achBody').innerHTML=h;S.seenAch=1;save();openPanel('#pAch');}
function openSkins(){
  const body=$('#skinBody');body.innerHTML=`<div class="how glass">Las estaciones se desbloquean con los <b>puntos totales</b> de todas tus partidas. Llevas <b>${fmt(S.tot)}</b>.</div>`;
  const prev=S.skin;
  SKORD.forEach((k,i)=>{const sk=SKINS[k];const lock=S.tot<sk.need;const b=document.createElement('button');b.className='skin glass'+(S.skin===k?' sel':'')+(lock?' lock':'');b.style.animationDelay=i*.06+'s';
    b.innerHTML=`<canvas width="168" height="168"></canvas><div><b>${sk.n}</b><span>${sk.d}</span><span style="margin-top:6px;font-weight:800;color:${lock?'#ffb3a8':'#bff7c9'}">${lock?'🔒 '+fmt(sk.need)+' puntos totales':S.skin===k?'✓ En uso':'Toca para usar'}</span></div>`;
    body.appendChild(b);const c=b.querySelector('canvas'),g=c.getContext('2d');S.skin=k;const s=c.width/(SQ3*R+8)*.9;const e=[[0,0,1,1,4,2],[1,1,3,3,0,2],[2,2,1,4,4,0],[3,3,0,1,1,4]][i];const sp=makeSprite(e,1234+i,s);g.drawImage(sp.c,(c.width-sp.c.width)/2,(c.height-sp.c.height)/2+6);S.skin=prev;
    b.onclick=()=>{if(lock){sfx.fail();return;}S.skin=k;save();sfx.ui();openSkins();};});
  S.seenSkin=1;save();if($('#pSkin').classList.contains('hide'))openPanel('#pSkin');
}
function openSettings(){
  const rows=[['snd','Sonidos','Efectos al colocar y girar'],['mus','Música','Melodía ambiental tranquila'],['vib','Vibración','Pequeños toques al jugar'],['hint','Huecos dorados','Marca dónde encaja bien tu loseta']];
  let h=rows.map(r=>`<div class="row glass"><div><b>${r[1]}</b><span>${r[2]}</span></div><button class="tog ${S.set[r[0]]?'on':''}" data-k="${r[0]}"></button></div>`).join('');
  h+=`<div class="sect">CÓMO SE JUEGA</div>
  <div class="how glass">🏝️ Cada loseta tiene 6 bordes de terreno. <b>Colócala junto a tu isla</b>: cada borde que coincide con su vecino suma 10 puntos.</div>
  <div class="how glass">✨ Si una loseta queda rodeada y <b>sus 6 bordes encajan</b>, es perfecta: +60 puntos y +1 loseta.</div>
  <div class="how glass">🦊 Las criaturas piden una <b>región de su terreno</b> de cierto tamaño. Si lo logras te dan losetas extra y se mudan a tu isla; si la región se cierra antes, se van.</div>
  <div class="how glass">🔒 Algunas piden un tamaño <b>exacto</b> (=5): la región tiene que quedar cerrada, sin bordes libres, con esas losetas justas. Dan el doble.</div>
  <div class="how glass">✋ Arrastra para mover la vista y pellizca para acercar o alejar. Toca la loseta colocada otra vez para girarla.</div>
  <div class="sect">DATOS</div><div class="row glass"><div><b>Borrar progreso</b><span>Récords, álbum, logros y estaciones</span></div><button class="dbtn red" id="bReset">Borrar</button></div>
  <div style="text-align:center;font-size:11px;opacity:.5;margin-top:14px">Isla Celeste · v10</div>`;
  $('#setBody').innerHTML=h;
  $('#setBody').querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.set[k]=S.set[k]?0:1;if(k==='mus')setMus(S.set[k]);save();b.classList.toggle('on',!!S.set[k]);sfx.ui();if(G)updateCand();});
  let armed=false;$('#bReset').onclick=e=>{if(!armed){armed=true;e.target.textContent='¿Seguro?';return;}localStorage.removeItem(SK);location.reload();};
  openPanel('#pSet');
}
$('#bAlbum').onclick=openAlbum;$('#bAch').onclick=openAch;$('#bSkin').onclick=openSkins;$('#bSet').onclick=openSettings;
$('#bPlay').onclick=()=>{sfx.ui();newGame('clasico');};
$('#bDaily').onclick=()=>{sfx.ui();newGame('diario');};
$('#bZen').onclick=()=>{sfx.ui();newGame('zen');};
$('#bRot').onclick=doRotate;$('#bUndo').onclick=doUndo;$('#bCur').onclick=doRotate;$('#bOk').onclick=()=>{if(world.ghost)confirmPlace();else{sfx.fail();}};
$('#bPause').onclick=()=>{if(!G||G.over)return;sfx.ui();G.paused=true;$('#pauseSub').textContent=G.name+' · '+(G.mode==='zen'?`${G.placed} losetas`:`${fmt(G.score)} puntos · quedan ${G.left} losetas`);$('#bEndZen').classList.toggle('hide',G.mode!=='zen');syncMini();$('#mPause').classList.remove('hide');};
$('#bResume').onclick=()=>{sfx.ui();G.paused=false;$('#mPause').classList.add('hide');};
$('#bRestart').onclick=()=>{sfx.ui();$('#mPause').classList.add('hide');newGame(G.mode);};
$('#bHome').onclick=()=>{sfx.ui();$('#mPause').classList.add('hide');if(G&&G.placed>0){S.tot+=G.mode==='zen'?0:0;}goMenu();};
$('#bEndZen').onclick=()=>{$('#mPause').classList.add('hide');G.paused=false;endGame();};
function syncMini(){[['tSnd','snd'],['tMus','mus'],['tVib','vib'],['tHint','hint']].forEach(([id,k])=>$('#'+id).classList.toggle('off',!S.set[k]));}
[['tSnd','snd'],['tMus','mus'],['tVib','vib'],['tHint','hint']].forEach(([id,k])=>$('#'+id).onclick=()=>{S.set[k]=S.set[k]?0:1;if(k==='mus')setMus(S.set[k]);save();syncMini();sfx.ui();});

// ===== Entrada táctil
const ptrs=new Map();let pinching=false,pan=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t0:now()});
  if(ptrs.size===1){pan={x:e.clientX,y:e.clientY,moved:false};}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.tz,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};pinching=true;if(pan)pan.moved=true;}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(scene==='menu')return;
  if(ptrs.size===1&&pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(!pan.moved&&Math.hypot(e.clientX-p.x0,e.clientY-p.y0)>9)pan.moved=true;if(pan.moved){cam.tx-=dx/cam.z;cam.ty-=dy/cam.z;cam.x=cam.tx;cam.y=cam.ty;}pan.x=e.clientX;pan.y=e.clientY;}
  else if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const nz=clamp(pinch.z*d/pinch.d,.4,2);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const wx=(mx-W/2)/cam.z+cam.x,wy=(my-H*camYF)/cam.z+cam.y;cam.z=cam.tz=nz;cam.x=cam.tx=wx-(mx-W/2)/nz;cam.y=cam.ty=wy-(my-H*camYF)/nz;
    cam.tx-=(mx-pinch.mx)/nz;cam.ty-=(my-pinch.my)/nz;cam.x=cam.tx;cam.y=cam.ty;pinch.mx=mx;pinch.my=my;}});
function endPtr(e){const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){if(pan&&!pan.moved&&now()-p.t0<.6)tapAt(e.clientX,e.clientY);pan=null;if(pinching){pinching=false;setSprScale();}}
  else if(ptrs.size===1){pinch=null;const [a]=[...ptrs.values()];pan={x:a.x,y:a.y,moved:true};}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{if(scene==='menu')return;e.preventDefault();cam.tz=clamp(cam.tz*Math.exp(-e.deltaY*.0015),.4,2);clearTimeout(cv._wt);cv._wt=setTimeout(()=>setSprScale(),200);},{passive:false});
function tapAt(sx,sy){
  if(scene!=='game'||!G||G.over||G.paused)return;
  const wx=(sx-W/2)/cam.z+cam.x,wy=(sy-H*camYF)/cam.z+cam.y-bobY();
  // la loseta fantasma se dibuja algo elevada: probar también ahí
  const [q,r]=toHex(wx,wy);const [q2,r2]=toHex(wx,wy+8);
  const gh=world.ghost;
  if(gh&&((gh.q===q&&gh.r===r)||(gh.q===q2&&gh.r===r2))){doRotate();return;}
  const c=world.cand.find(c=>c.q===q&&c.r===r)||world.cand.find(c=>c.q===q2&&c.r===r2);
  if(c){setGhost(c.q,c.r);return;}
  const tl=world.map.get(key(q,r));
  if(tl){const qs=G.quests.filter(x=>x.tile===tl.id&&!x.done&&!x.fail);if(qs.length){const x=qs[0];highlightQuest(x);toast(CR[x.cr].e,CR[x.cr].n,x.ex?`Quiere un ${TN[x.terr]} cerrado de exactamente ${x.n} losetas. Lleva ${x.prog}.`:`Quiere un ${TN[x.terr]} de ${x.n} losetas. Lleva ${x.prog}.`,'');}}
}

let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').classList.remove('hide');});
$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;$('#installBtn').classList.add('hide');};
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic|usercontent/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(S.set.mus||S.set.snd)AC.resume();});
document.addEventListener('pointerdown',()=>{if(AC&&AC.state==='suspended')AC.resume();},{passive:true});

resize();makeCloudSprites();initSky();makeFarIslands();goMenu();cam.x=0;cam.y=40;cam.z=menuZoom()*.8;requestAnimationFrame(render);

window.__isla={get G(){return G},get world(){return world},newGame,setGhost,confirmPlace,doRotate,endGame,S,cam,goMenu,openAlbum,openAch,openSkins,openSettings,set dayT(v){dayT=v},get dayT(){return dayT}};
window.__mk=makeSprite;
