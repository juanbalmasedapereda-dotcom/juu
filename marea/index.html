<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Marea · La última farera</title>
<style>
:root{
  --bg:#0a1430; --ink:#fff6e4; --dim:#a9b6d6; --amber:#ffc35c; --amber2:#ff9a3d; --teal:#4fe0d6; --coral:#ff8a6b; --navy:#101d44;
  --glass:rgba(14,24,58,.72); --line:rgba(255,214,150,.28);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .4s ease,visibility 0s linear .4s;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px)}
.scr.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .4s ease,visibility 0s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
.ico{width:22px;height:22px;display:block;flex:none}

/* ---------- MENÚ ---------- */
#scr-menu{justify-content:space-between}
.logo{margin-top:min(7vh,56px);text-align:center;position:relative}
.logo-k{font-size:10.5px;letter-spacing:.28em;white-space:nowrap;text-transform:uppercase;color:#ffd99a;opacity:.0;padding-left:.55em;animation:fadeup .9s .2s ease forwards}
.logo-t{font-family:var(--serif);font-size:clamp(64px,21vw,104px);font-weight:700;letter-spacing:.03em;line-height:.95;margin-top:6px;
  color:#ffe3ad;text-shadow:0 2px 0 #c9783e,0 5px 0 #6a3a3a,0 10px 24px rgba(10,5,30,.55);
  animation:logoin 1.3s cubic-bezier(.2,1.2,.3,1) both}
.logo-t span{display:inline-block;animation:bob 4.2s ease-in-out infinite}
.logo-s{margin-top:10px;font-family:var(--serif);font-style:italic;font-size:19px;color:#cfe8ff;opacity:0;animation:fadeup .9s .6s ease forwards;
  text-shadow:0 2px 12px rgba(0,0,0,.6)}
@keyframes logoin{0%{opacity:0;transform:translateY(-20px) scale(.92);filter:blur(8px)}100%{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:.95;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flames{display:flex;gap:10px;justify-content:center;margin-top:16px;opacity:0;animation:fadeup .9s .9s ease forwards}
.fl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.08),rgba(0,0,0,.25));
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.fl svg{width:18px;height:18px;opacity:.25;filter:grayscale(1)}
.fl.on{border-color:var(--c);box-shadow:0 0 14px var(--c),inset 0 0 10px var(--c);background:radial-gradient(circle,rgba(255,255,255,.2),rgba(0,0,0,.2))}
.fl.on svg{opacity:1;filter:none;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1)}40%{transform:scale(1.12,0.94)}70%{transform:scale(.95,1.08)}}
.menu-bot{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;align-items:stretch;opacity:0;animation:fadeup .9s 1.1s ease forwards}
.btn{position:relative;min-height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:.02em;
  transition:transform .12s ease,filter .2s;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-main{color:#3a1d05;background:linear-gradient(180deg,#ffe29a 0%,#ffbf55 48%,#ff9838 100%);
  box-shadow:0 8px 26px rgba(255,150,60,.42),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(170,70,10,.35)}
.btn-main::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:sheen 3.8s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}85%,100%{left:130%}}
.btn-main small{display:block;font-size:11.5px;font-weight:700;opacity:.7;letter-spacing:.04em;margin-top:1px}
.btn-main .bt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.btn-glass{color:var(--ink);background:linear-gradient(180deg,rgba(40,58,120,.62),rgba(18,28,70,.72));border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .btn{font-size:16px;min-height:54px}
.btn .ico{width:22px;height:22px}
.foot{font-size:11px;color:var(--dim);text-align:center;opacity:.7;margin-top:2px;display:flex;justify-content:center;gap:12px;align-items:center;min-height:20px}
.inst{pointer-events:auto;color:#ffd99a;font-weight:800;font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,210,140,.35);display:none}
.inst.on{display:inline-block}

/* ---------- PANEL GENÉRICO ---------- */
.top{width:100%;max-width:460px;display:flex;align-items:center;gap:10px;min-height:48px}
.ibtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);flex:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ibtn:active{transform:scale(.94)}
.ttl{font-family:var(--serif);font-size:24px;font-weight:700;flex:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.panel{width:100%;max-width:460px;background:linear-gradient(180deg,rgba(26,38,88,.86),rgba(12,20,52,.9));border:1px solid var(--line);border-radius:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1;width:100%;max-width:460px;margin-top:10px;padding-bottom:20px}
.sec{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffd99a;margin:18px 4px 8px;font-weight:800}

/* ---------- MAPA ---------- */
#scr-map{justify-content:space-between}
#scr-map.on{pointer-events:none}#scr-map .top,#scr-map #mapcard{pointer-events:auto}#scr-map #mapcard:not(.on){pointer-events:none}
#mapcard{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;transform:translateY(20px);opacity:0;transition:transform .35s cubic-bezier(.2,1,.3,1),opacity .3s}
#mapcard.on{transform:none;opacity:1}
.mc-h{display:flex;align-items:center;gap:12px}
.mc-medal{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.35),transparent 60%),var(--mc,#4fe0d6);
  box-shadow:0 0 18px var(--mc,#4fe0d6),inset 0 -3px 0 rgba(0,0,0,.25)}
.mc-medal svg{width:28px;height:28px}
.mc-n{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.1}
.mc-s{font-size:13px;color:var(--dim);margin-top:3px}
.mc-stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:700}
.chip svg{width:16px;height:16px}
.maphint{font-family:var(--serif);font-style:italic;color:#d9e8ff;font-size:15px;text-align:center;margin-top:6px;text-shadow:0 2px 8px rgba(0,0,0,.8)}

/* ---------- JUEGO (HUD) ---------- */
#scr-game{justify-content:space-between;padding-top:calc(var(--sat) + 8px)}
#scr-game.on{pointer-events:none}
#scr-game .hud-t,#scr-game .hud-b{pointer-events:auto}
.hud-t{width:100%;max-width:460px;display:flex;align-items:center;gap:8px}
.rname{flex:1;min-width:0;padding:7px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rname b{display:block;font-family:var(--serif);font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffd99a;opacity:.85}
.stat{height:46px;padding:0 10px;border-radius:14px;display:flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:15px;flex:none}
.stat svg{width:18px;height:18px}
.stat.hide{display:none}
#fireStat{gap:3px}
.fpip{width:6px;height:14px;border-radius:3px;background:rgba(255,255,255,.15)}
.fpip.on{background:linear-gradient(#ffe08a,#ff7a2e);box-shadow:0 0 8px #ff9b3d}
.hud-b{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hbtn{height:52px;min-width:52px;padding:0 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.hbtn:active{transform:scale(.94)}
.hbtn[disabled]{opacity:.4}
.hgrp{display:flex;gap:8px}
#dpad{position:relative;width:150px;height:150px;display:none}
#dpad.on{display:block}
#dpad button{position:absolute;width:52px;height:52px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center}
#dpad button:active{background:rgba(255,195,92,.35)}
#dpad .u{left:49px;top:0}#dpad .d{left:49px;bottom:0}#dpad .l{left:0;top:49px}#dpad .r{right:0;top:49px}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 70px);transform:translate(-50%,-10px);opacity:0;transition:all .3s;padding:10px 16px;border-radius:14px;
  background:rgba(10,18,44,.9);border:1px solid var(--line);font-weight:700;font-size:14px;max-width:86vw;text-align:center;pointer-events:none;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
.banner.on{animation:banner 2.6s ease forwards}
.banner .b1{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#ffd99a;padding-left:.5em}
.banner .b2{font-family:var(--serif);font-size:38px;font-weight:700;text-shadow:0 4px 20px rgba(0,0,0,.7);margin-top:6px}
.banner .bl{width:120px;height:2px;margin:10px auto 0;background:linear-gradient(90deg,transparent,#ffd99a,transparent)}
@keyframes banner{0%{opacity:0;transform:translateY(10px);letter-spacing:.1em}15%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}

/* ---------- DIÁLOGO ---------- */
#dlg{position:absolute;left:0;right:0;bottom:0;padding:0 calc(var(--sar) + 12px) calc(var(--sab) + 14px) calc(var(--sal) + 12px);display:flex;justify-content:center;
  pointer-events:none;opacity:0;transform:translateY(30px);transition:opacity .25s,transform .3s cubic-bezier(.2,1,.3,1)}
#dlg.on{opacity:1;transform:none;pointer-events:auto}
.dbox{position:relative;width:100%;max-width:460px;min-height:150px;padding:18px 18px 16px 116px;border-radius:22px;
  background:linear-gradient(180deg,#fff8ea,#f6e6c6);color:#3b2a1a;border:3px solid #5a3b1f;box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 -4px 0 rgba(120,80,30,.18)}
.dbox.narr{padding-left:18px;background:linear-gradient(180deg,rgba(20,30,70,.95),rgba(10,16,40,.96));color:var(--ink);border-color:rgba(255,214,150,.45)}
.dbox.narr #dport,.dbox.narr .dname{display:none}
.dbox.narr #dtxt{font-family:var(--serif);font-style:italic;font-size:18px;text-align:center}
#dport{position:absolute;left:12px;top:-26px;width:94px;height:94px;border-radius:22px;background:#2a3f7a;border:3px solid #5a3b1f;box-shadow:0 8px 20px rgba(0,0,0,.35);overflow:hidden}
#dport canvas{width:100%;height:100%;display:block}
.dname{position:absolute;left:12px;top:74px;width:94px;text-align:center;font-weight:900;font-size:13px;color:#5a3b1f;line-height:1.1}
#dtxt{font-size:17px;line-height:1.42;font-weight:600;min-height:72px}
#dtxt em{font-style:normal;color:#c2541a;font-weight:900}
.dnext{position:absolute;right:16px;bottom:10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid #c2541a;animation:bob 1s infinite}
.dbox.narr .dnext{border-top-color:#ffd99a}

/* ---------- TARJETAS ---------- */
.modal{position:absolute;inset:0;background:rgba(4,8,24,.6);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;
  transition:opacity .3s,visibility 0s linear .3s;pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s,visibility 0s}
.mbox{width:100%;max-width:380px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;transform:scale(.92);transition:transform .35s cubic-bezier(.2,1.3,.3,1)}
.modal.on .mbox{transform:none}
.mbox h2{margin:0 0 4px;font-family:var(--serif);font-size:28px;text-align:center}
.mbox .btn{min-height:54px;font-size:16px}
.flamecard{text-align:center;align-items:center}
.flamecard .big{width:150px;height:150px;margin:-60px auto 0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--fc) 0%,transparent 68%)}
.flamecard .big svg{width:90px;height:90px;animation:flick 1.4s ease-in-out infinite;filter:drop-shadow(0 0 16px var(--fc))}
.flamecard .btn{align-self:stretch}
.flamecard .k{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#ffd99a}
.flamecard p{margin:0;color:#d6e2ff;font-size:15px;line-height:1.45}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);min-height:56px;font-weight:700}
.tog{width:56px;height:32px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tog.on{background:linear-gradient(90deg,#ffb84d,#ff8a3d)}
.tog.on::after{left:27px}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:3px}
.seg button{padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;color:var(--dim)}
.seg button.on{background:#ffc35c;color:#3a1d05}
.danger{color:#ff9d8a}

/* ---------- DIARIO ---------- */
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dcard{padding:14px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.dcard .dt{font-family:var(--serif);font-weight:700;font-size:17px}
.dcard .dd{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.35}
.dcard.lock{opacity:.45}
.fcard{display:flex;align-items:center;gap:12px;grid-column:span 2}
.fcard .fm{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25)}
.fcard .fm svg{width:26px;height:26px}
.fcard.lock .fm svg{filter:grayscale(1);opacity:.3}
.pcard{display:flex;gap:12px;align-items:center;grid-column:span 2}
.pcard canvas{width:64px;height:64px;border-radius:16px;flex:none;background:#2a3f7a}
.pearls{display:flex;gap:4px;margin-top:6px}
.pearls i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12)}
.pearls i.on{background:radial-gradient(circle at 35% 30%,#fff,#ffe4f1 40%,#d9a7c7);box-shadow:0 0 6px #ffd6ee}

/* ---------- INTRO / FUNDIDO ---------- */
#fade{position:absolute;inset:0;background:#050a1c;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
@media (max-height:640px){.logo{margin-top:20px}.logo-t{font-size:66px}.btn{min-height:52px}.dbox{min-height:132px}#dtxt{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <!-- MENÚ -->
  <section class="scr" id="scr-menu">
    <div class="logo">
      <div class="logo-k">Una aventura en el archipiélago</div>
      <div class="logo-t" id="logoT">Marea</div>
      <div class="logo-s">La última farera</div>
      <div class="flames" id="menuFlames"></div>
    </div>
    <div class="menu-bot">
      <button class="btn btn-main" id="bPlay"><svg class="ico" viewBox="0 0 24 24"><use href="#i-lantern"/></svg><span class="bt"><span id="bPlayT">Nueva aventura</span><small id="bPlayS">Empieza la historia</small></span></button>
      <div class="row2">
        <button class="btn btn-glass" id="bDiary"><svg class="ico" viewBox="0 0 24 24"><use href="#i-book"/></svg>Diario</button>
        <button class="btn btn-glass" id="bSet"><svg class="ico" viewBox="0 0 24 24"><use href="#i-gear"/></svg>Ajustes</button>
      </div>
      <div class="foot"><span id="ver">v3</span><button class="inst" id="bInst">📲 Instalar app</button></div>
    </div>
  </section>

  <!-- MAPA DEL MAR -->
  <section class="scr" id="scr-map">
    <div class="top"><button class="ibtn" id="mapBack"><svg class="ico" viewBox="0 0 24 24"><use href="#i-back"/></svg></button><div class="ttl">El archipiélago</div>
      <div class="stat"><svg viewBox="0 0 24 24"><use href="#i-pearl"/></svg><span id="mapPearls">0</span></div></div>
    <div style="flex:1"></div>
    <div class="maphint" id="maphint">Toca una isla para zarpar</div>
    <div class="panel" id="mapcard">
      <div class="mc-h"><div class="mc-medal" id="mcMedal"><svg viewBox="0 0 24 24"><use href="#i-flame"/></svg></div>
        <div style="flex:1;min-width:0"><div class="mc-n" id="mcName">Isla</div><div class="mc-s" id="mcSub">—</div></div></div>
      <div class="mc-stats" id="mcStats"></div>
      <button class="btn btn-main" id="mcGo"><svg class="ico" viewBox="0 0 24 24"><use href="#i-sail"/></svg><span id="mcGoT">Zarpar</span></button>
    </div>
  </section>

  <!-- JUEGO -->
  <section class="scr" id="scr-game">
    <div class="hud-t">
      <div class="rname"><i id="hIsl">Isla</i><b id="hRoom">Sala</b></div>
      <div class="stat" id="pearlStat"><svg viewBox="0 0 24 24"><use href="#i-pearl"/></svg><span id="hPearls">0</span></div>
      <div class="stat hide" id="keyStat"><svg viewBox="0 0 24 24"><use href="#i-key"/></svg><span id="hKeys">0</span></div>
      <button class="ibtn" id="bPause"><svg class="ico" viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
    </div>
    <div class="hud-b">
      <div class="hgrp">
        <button class="hbtn" id="bUndo"><svg class="ico" viewBox="0 0 24 24"><use href="#i-undo"/></svg>Atrás</button>
        <button class="hbtn" id="bReset"><svg class="ico" viewBox="0 0 24 24"><use href="#i-reset"/></svg></button>
      </div>

<script>
// ===================== NÚCLEO (lógica pura, también usada por el resolvedor) =====================
const RW = 9, RH = 13;
const DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
const DIRN = { u: 'n', d: 's', l: 'w', r: 'e' };
const OPP = { n: 's', s: 'n', e: 'w', w: 'e' };
const NPC_CH = 'APMRZ';            // personajes (sólidos)
const ITEM_CH = 'pkh';             // perla, llave, objeto de misión
const idx = (x, y) => y * RW + x;
const ix = i => i % RW, iy = i => (i / RW) | 0;

function buildRoom(def, flags) {
  const t = [], crates = [], crabs = [], rocks = [];
  for (let y = 0; y < RH; y++) {
    const row = def.map[y];
    for (let x = 0; x < RW; x++) {
      let c = row[x];
      if (c === 'B') { crates.push(idx(x, y)); c = '.'; }
      else if (c === 'C') { crabs.push({ i: idx(x, y), d: 1, v: 0 }); c = '.'; }
      else if (c === 'V') { crabs.push({ i: idx(x, y), d: 1, v: 1 }); c = '.'; }
      else if (c === 'K') { crates.push(idx(x, y)); c = 's'; }
      else if (c === 'O') { rocks.push(idx(x, y)); c = '.'; }
      t.push(c);
    }
  }
  const st = { t, crates, rocks, crabs, tide: def.tide || 0, fire: 0, keys: 0, p: 0, dir: 'u', turn: 0 };
  if (def.onBuild && flags) def.onBuild(st, flags);
  return st;
}
function cloneSt(s) {
  return { t: s.t.slice(), crates: s.crates.slice(), rocks: (s.rocks || []).slice(), crabs: s.crabs.map(c => ({ i: c.i, d: c.d, v: c.v })),
    tide: s.tide, fire: s.fire, keys: s.keys, p: s.p, dir: s.dir, turn: s.turn };
}
function stKey(s) {
  return s.t.join('') + '|' + s.crates.slice().sort((a, b) => a - b).join(',') + '|' + (s.rocks || []).slice().sort((a, b) => a - b).join(',') + '|' + s.p + '|' + s.tide + s.fire + '|' + s.keys + '|' +
    s.crabs.map(c => c.i + ':' + c.d).join(',');
}
function plateList(s) { const r = []; for (let i = 0; i < s.t.length; i++) if (s.t[i] === 'o') r.push(i); return r; }
// --- haces de luz: emisores 1↑ 2→ 3↓ 4←, espejos / \\, receptores Q ---
const EMIT = { '1': 'u', '2': 'r', '3': 'd', '4': 'l' };
const MIR = { '/': { r: 'u', u: 'r', l: 'd', d: 'l' }, '\\': { r: 'd', d: 'r', l: 'u', u: 'l' } };
const BEAM_PASS = '.,=o_swpkhcl';
function beams(s) {
  const segs = [], lit = {};
  for (let e = 0; e < s.t.length; e++) {
    const dir0 = EMIT[s.t[e]]; if (!dir0) continue;
    let i = e, dir = dir0, n = 0; const path = [e];
    while (n++ < 120) {
      const x = ix(i) + DIRS[dir][0], y = iy(i) + DIRS[dir][1];
      if (x < 0 || y < 0 || x >= RW || y >= RH) { path.push(-1 - 'udlr'.indexOf(dir)); break; }
      i = idx(x, y); const c = s.t[i];
      if (occ(s, i)) { path.push(i); break; }
      if (MIR[c]) { path.push(i); dir = MIR[c][dir]; continue; }
      if (c === 'Q') { lit[i] = 1; path.push(i); break; }
      if (c === 'G' && gateOpenNoBeam(s)) { continue; }
      if (BEAM_PASS.indexOf(c) < 0 && c !== 'G') { path.push(i); break; }
      if (c === 'G') { path.push(i); break; }
    }
    segs.push(path);
  }
  return { segs, lit };
}
function gateOpenNoBeam(s) {
  for (let i = 0; i < s.t.length; i++) { const c = s.t[i]; if (c === 'o') { if (s.p !== i && !occ(s, i)) return false; } else if (c === 'f') return false; }
  return true;
}
function gateOpen(s) {
  if (s.t.indexOf('Q') >= 0) { const L = beams(s).lit; for (let i = 0; i < s.t.length; i++) if (s.t[i] === 'Q' && !L[i]) return false; }
  let any = false;
  for (let i = 0; i < s.t.length; i++) {
    const c = s.t[i];
    if (c === 'o') { any = true; if (s.p !== i && !occ(s, i)) return false; }
    else if (c === 'f') return false;
  }
  return true;
}
function occ(s, i) { return s.crates.indexOf(i) >= 0 || (s.rocks && s.rocks.indexOf(i) >= 0); }
function gateBlockedOpen(s, i) { return s.p === i || occ(s, i); }
function walkable(s, i, who) { // who: 'p' jugador, 'c' caja, 'k' cangrejo
  const c = s.t[i];
  if (c === 's') return s.tide === 0;
  if (c === 'G') {
    if (who === 'p') { const op = s.p; s.p = i; const r = gateOpen(s); s.p = op; return r || s.crates.indexOf(i) >= 0; }
    return gateOpen(s) || gateBlockedOpen(s, i);
  }
  if (c === '.' || c === ',' || c === '=' || c === 'o' || c === '_' || c === 'c') return true;
  if (who === 'p' && ITEM_CH.indexOf(c) >= 0) return true;
  return false;
}
function crabAt(s, i) { for (const c of s.crabs) if (c.i === i) return true; return false; }

// Mueve al jugador; devuelve lista de eventos. ctx: {fireMax, exits, flags}
function doMove(s, dir, ctx) {
  const ev = [];
  const [dx, dy] = DIRS[dir];
  s.dir = dir;
  const x = ix(s.p), y = iy(s.p), nx = x + dx, ny = y + dy;
  if (nx < 0 || ny < 0 || nx >= RW || ny >= RH) {
    const d = DIRN[dir];
    if (ctx.exits && ctx.exits[d]) ev.push({ k: 'exit', d });
    else ev.push({ k: 'bump' });
    return ev;
  }
  const ni = idx(nx, ny), c = s.t[ni];
  // cangrejo en el destino: pellizco
  if (crabAt(s, ni)) { ev.push({ k: 'caught', i: ni }); return ev; }
  // roca rodante: rueda hasta chocar; en lava o agua, la rellena
  const ri = s.rocks ? s.rocks.indexOf(ni) : -1;
  if (ri >= 0) {
    let cur = ni, filled = -1;
    for (let n = 0; n < 20; n++) {
      const qx = ix(cur) + dx, qy = iy(cur) + dy;
      if (qx < 0 || qy < 0 || qx >= RW || qy >= RH) break;
      const q = idx(qx, qy), qc = s.t[q];
      if (occ(s, q) || crabAt(s, q)) break;
      if (qc === 'l' || qc === 'w' || (qc === 's' && s.tide === 1)) { filled = q; break; }
      if (walkable(s, q, 'c')) { cur = q; continue; }
      break;
    }
    if (filled >= 0) { s.rocks.splice(ri, 1); const was = s.t[filled]; s.t[filled] = 'c'; ev.push({ k: 'fill', i: filled, from: ni, lava: was === 'l' }); }
    else if (cur !== ni) { s.rocks[ri] = cur; ev.push({ k: 'roll', i: cur, from: ni }); if (s.t[cur] === 'o') ev.push({ k: 'plate', i: cur }); }
    else { ev.push({ k: 'bump' }); return ev; }
    afterStep(s, ev, ctx); return ev;
  }
  // caja
  const ci = s.crates.indexOf(ni);
  if (ci >= 0) {
    const bx = nx + dx, by = ny + dy;
    if (bx < 0 || by < 0 || bx >= RW || by >= RH) { ev.push({ k: 'bump' }); return ev; }
    const bi = idx(bx, by), bc = s.t[bi];
    if (occ(s, bi) || crabAt(s, bi)) { ev.push({ k: 'bump' }); return ev; }
    if (bc === 'l') { s.crates.splice(ci, 1); ev.push({ k: 'burnbox', i: bi, from: ni }); s.p = ni; afterStep(s, ev, ctx); return ev; }
    if (bc === 'w' || (bc === 's' && s.tide === 1)) {
      s.crates.splice(ci, 1); s.t[bi] = '_'; ev.push({ k: 'sink', i: bi, from: ni });
    } else if (walkable(s, bi, 'c')) {
      s.crates[ci] = bi; ev.push({ k: 'push', i: bi, from: ni });
      if (bc === 'o') ev.push({ k: 'plate', i: bi });
    } else { ev.push({ k: 'bump' }); return ev; }
    s.p = ni; afterStep(s, ev, ctx); return ev;
  }
  if (walkable(s, ni, 'p')) {
    s.p = ni;
    if (c === 'p') { s.t[ni] = '.'; ev.push({ k: 'pearl', i: ni }); }
    else if (c === 'k') { s.t[ni] = '.'; s.keys++; ev.push({ k: 'key', i: ni }); }
    else if (c === 'h') { s.t[ni] = '.'; ev.push({ k: 'item', i: ni }); }
    else if (c === 'o') ev.push({ k: 'plate', i: ni });
    afterStep(s, ev, ctx); return ev;
  }
  // interacciones (no gastan turno)
  if (c === 'b') {
    if (s.t[s.p] === 's' && s.tide === 0) { ev.push({ k: 'say', txt: 'wet' }); return ev; }
    s.tide = 1 - s.tide; ev.push({ k: 'bell', i: ni, tide: s.tide });
    if (s.tide === 1) {
      for (let j = s.crates.length - 1; j >= 0; j--) {
        const q = s.crates[j]; if (s.t[q] === 's') { s.crates.splice(j, 1); s.t[q] = '_'; ev.push({ k: 'sink', i: q, from: q }); }
      }
    }
    return ev;
  }
  if (c === 'l') { s.fire = ctx.fireMax || 8; ev.push({ k: 'fire', i: ni, lava: 1 }); return ev; }
  if (c === 'F') { s.fire = ctx.fireMax || 8; ev.push({ k: 'fire', i: ni }); return ev; }
  if (c === 'f') {
    if (s.fire > 0) { s.t[ni] = 'F'; s.fire = ctx.fireMax || 8; ev.push({ k: 'light', i: ni }); if (gateOpen(s)) ev.push({ k: 'gate' }); }
    else ev.push({ k: 'say', txt: 'nofire' });
    return ev;
  }
  if (c === '%') {
    if (s.fire > 0) { s.t[ni] = ','; ev.push({ k: 'burn', i: ni }); }
    else ev.push({ k: 'say', txt: 'bramble' });
    return ev;
  }
  if (c === 'D') {
    if (s.keys > 0) { s.keys--; s.t[ni] = '.'; ev.push({ k: 'unlock', i: ni }); }
    else ev.push({ k: 'say', txt: 'locked' });
    return ev;
  }
  if (MIR[c]) { s.t[ni] = c === '/' ? '\\' : '/'; ev.push({ k: 'mirror', i: ni }); return ev; }
  if (c === '*') { ev.push({ k: 'shrine', i: ni }); return ev; }
  if (c === 'L') { ev.push({ k: 'faro', i: ni }); return ev; }
  if (c === 'Y') { ev.push({ k: 'boat', i: ni }); return ev; }
  if (c === 'S') { ev.push({ k: 'sign', i: ni }); return ev; }
  if (NPC_CH.indexOf(c) >= 0) { ev.push({ k: 'talk', npc: c, i: ni }); return ev; }
  ev.push({ k: 'bump' });
  return ev;
}
function afterStep(s, ev, ctx) {
  s.turn++;
  if (s.fire > 0) { s.fire--; if (s.fire === 0) ev.push({ k: 'fireout' }); }
  // cangrejos
  for (const cr of s.crabs) {
    let moved = false;
    for (let tries = 0; tries < 2 && !moved; tries++) {
      const x = ix(cr.i), y = iy(cr.i);
      const nx = x + (cr.v ? 0 : cr.d), ny = y + (cr.v ? cr.d : 0);
      if (nx >= 0 && ny >= 0 && nx < RW && ny < RH) {
        const ni = idx(nx, ny), c = s.t[ni];
        const ok = (c === '.' || c === ',' || c === '=' || c === 'o' || c === '_' || c === 'c' || (c === 'G' && gateOpen(s))) &&
          !occ(s, ni) && !s.crabs.some(o => o !== cr && o.i === ni);
        if (ok) { cr.i = ni; moved = true; break; }
      }
      cr.d = -cr.d;
    }
  }
  if (crabAt(s, s.p)) ev.push({ k: 'caught', i: s.p });
}
// BFS para caminar tocando (sin empujar). Devuelve lista de direcciones.
function findPath(s, target, adjacentOk) {
  const prev = new Int16Array(RW * RH).fill(-1), seen = new Uint8Array(RW * RH);
  const q = [s.p]; seen[s.p] = 1;
  const isGoal = i => i === target || (adjacentOk && (Math.abs(ix(i) - ix(target)) + Math.abs(iy(i) - iy(target)) === 1));
  let found = isGoal(s.p) ? s.p : -1;
  while (q.length && found < 0) {
    const i = q.shift();
    for (const k in DIRS) {
      const nx = ix(i) + DIRS[k][0], ny = iy(i) + DIRS[k][1];

function tileAt(px, py) { const L = G.lay; const x = Math.floor((px - L.ox) / L.T), y = Math.floor((py - L.oy) / L.T); if (x < 0 || y < 0 || x >= RW || y >= RH) return -1; return idx(x, y); }
const SOLID_INTERACT = 'bfF%D*LYSAPMRZhl/\\';
function dirTo(a, b) { const d = b - a; return d === 1 ? 'r' : d === -1 ? 'l' : d === RW ? 'd' : d === -RW ? 'u' : null; }
function adjacent(a, b) { return Math.abs(ix(a) - ix(b)) + Math.abs(iy(a) - iy(b)) === 1; }
function handleTap(i) {
  const s = G.room.st; if (i === s.p) return;
  G.marker = { i, t0: performance.now() };
  const ch = s.t[i], isCrate = s.crates.indexOf(i) >= 0;
  if (isCrate || SOLID_INTERACT.indexOf(ch) >= 0 || (ch === 'G' && !walkable(s, i, 'p'))) {
    if (adjacent(s.p, i)) { G.queue = [dirTo(s.p, i)]; return; }
    const path = findPath(s, i, true);
    if (path) { G.queue = path; if (!isCrate && ch !== 'G') { // al llegar, interactuar
      let p = s.p; for (const d of path) p += d === 'r' ? 1 : d === 'l' ? -1 : d === 'd' ? RW : -RW; const d2 = dirTo(p, i); if (d2) G.queue.push(d2); } }
    else AU.play('bump');
    return;
  }
  const path = findPath(s, i, false);
  if (path) G.queue = path;
  else { // ¿borde de salida? intenta acercarse
    AU.play('bump');
  }
}

  ], () => {

    fade(() => { SV = Object.assign(newSave(SV.set)); G.flags = SV.flags; enterRoom('f2', idx(4, 8), 'd'); setTimeout(() => npcTalk('A', idx(5, 10)), 700); }, 400);
  });
  const watch = setInterval(() => { if (!G.dlg) return clearInterval(watch); if (G.dlg.n === 1 && MENU.intro < 1) { MENU.intro = 1; AU.play('fireout'); } if (G.dlg.n === 2 && MENU.intro < 2) { MENU.intro = 2; MENU.flyT = performance.now(); AU.play('flame'); } }, 100);
}
$('bDiary').onclick = () => { AU.init(); AU.play('tap'); openDiary('menu'); };
$('bSet').onclick = () => { AU.init(); AU.play('tap'); openSettings(); };
$('bPause').onclick = () => { AU.play('tap'); modal('m-pause', true); };
$('pResume').onclick = () => { AU.play('tap'); modal('m-pause', false); };
$('pBoat').onclick = () => { modal('m-pause', false); if (!SV.flags.sawFaro) return toast('Primero visita el faro, al norte de la casita.'); persistRoom(); AU.play('sail'); fade(openMap); };
$('pDiary').onclick = () => { modal('m-pause', false); openDiary('game'); };
$('pSet').onclick = () => { modal('m-pause', false); openSettings(); };
$('pMenu').onclick = () => { modal('m-pause', false); if (G.room) persistRoom(); fade(() => { G.room = null; show('menu'); }); };
$('bUndo').onclick = doUndo;
$('bReset').onclick = doReset;
$('flGo').onclick = () => { modal('m-flame', false); AU.play('sail'); fade(openMap); };
$('flStay').onclick = () => { modal('m-flame', false); };
let confirmFn = null;
function confirmBox(t, p, fn) { $('cfT').textContent = t; $('cfP').textContent = p; confirmFn = fn; modal('m-conf', true); }
$('cfNo').onclick = () => modal('m-conf', false);
$('cfYes').onclick = () => { modal('m-conf', false); if (confirmFn) confirmFn(); };

// ---------- ajustes ----------
function openSettings() {
  const st = SV.set;
  $('tMus').classList.toggle('on', st.mus); $('tSfx').classList.toggle('on', st.sfx); $('tVib').classList.toggle('on', st.vib);
  $('segCtl').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === st.ctl));
  modal('m-set', true);
}
$('tMus').onclick = () => { SV.set.mus = !SV.set.mus; AU.setMus(SV.set.mus); save(); openSettings(); };
$('tSfx').onclick = () => { SV.set.sfx = !SV.set.sfx; AU.setSfx(SV.set.sfx); save(); openSettings(); AU.play('tap'); };
$('tVib').onclick = () => { SV.set.vib = !SV.set.vib; save(); openSettings(); vib(30); };
$('segCtl').querySelectorAll('button').forEach(b => b.onclick = () => { SV.set.ctl = b.dataset.v; save(); openSettings(); if (G.room) { G.lay = roomLayout(); rebuildGround(); updHud(); } });
$('sClose').onclick = () => { AU.play('tap'); modal('m-set', false); };
$('sWipe').onclick = () => { modal('m-set', false); confirmBox('¿Borrar la partida?', 'Perderás llamas, perlas y todo el progreso. No se puede deshacer.', () => { SV = newSave(SV.set); G.flags = SV.flags; save(); G.room = null; show('menu'); toast('Partida borrada'); }); };

// ---------- diario ----------
let diaryFrom = 'menu';
function openDiary(from) {
  diaryFrom = from;
  const f = SV.flags;
  let h = '<div class="sec">Las cuatro llamas</div><div class="dgrid">';
  for (const id of FLAME_IDS) { const I = ISL[id], has = SV.flames.includes(id); h += `<div class="dcard fcard ${has ? '' : 'lock'}"><div class="fm" style="${has ? `box-shadow:0 0 14px ${I.col};border-color:${I.col}` : ''}">${flameSvg(I.col)}</div><div><div class="dt">${I.flame}</div><div class="dd">${has ? 'Brilla de nuevo en el Faro Mayor.' : (islandOpen(id) ? 'Escondida en ' + I.name + '.' : 'En una isla cubierta de niebla.')}</div></div></div>`; }
  h += '</div><div class="sec">Perlas</div><div class="dgrid">';
  for (const I of ISLANDS) { const tp = pearlTotal(I.id); if (!tp) continue; const n = pearlCount(I.id); h += `<div class="dcard"><div class="dt">${I.name}</div><div class="pearls">${Array.from({ length: tp }, (_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</div><div class="dd">${n}/${tp}</div></div>`; }
  h += '</div><div class="sec">Personajes</div><div class="dgrid" id="dPeople">';
  const people = [['nia', 'Nía', 'Aprendiz de farera. Cabezota, valiente y con un farol que nunca suelta.', true], ['abuela', 'Abuela Brisa', 'Farera retirada. Sabe de mareas, de cocina y de regañar con cariño.', f.metAbuela], ['percebe', 'Capitán Percebe', 'Terror de los siete charcos. Sin sombrero se viene abajo.', f.metPercebe], ['musgo', 'Musgo', 'Tortuga de trescientos años con un arbolito en la espalda. Habla… muy… despacio.', f.metMusgo], ['rafa', 'Rafa', 'Gaviota cartera. Entrega casi todas las cartas. Las de sardinas, no.', f.metRafa], ['chef', 'Chef Salamandra', 'Cocinera del volcán. Lo hace todo a la lava, hasta el helado.', f.metChef]];
  for (const [id, n, d, met] of people) h += `<div class="dcard pcard ${met ? '' : 'lock'}"><canvas data-p="${met ? id : ''}" width="128" height="128"></canvas><div><div class="dt">${met ? n : '???'}</div><div class="dd">${met ? d : 'Aún no os habéis conocido.'}</div></div></div>`;
  h += '</div><div class="sec">Cómo se juega</div><div class="dcard" style="grid-column:span 2"><div class="dd" style="font-size:14px;line-height:1.55">👆 <b>Toca</b> una casilla para caminar hasta ella, o <b>desliza</b> para dar un paso.<br>📦 Toca una caja <b>a tu lado</b> para empujarla. En el agua se hunde y hace de puente.<br>🔔 La <b>campana</b> sube o baja la marea: con marea baja se camina por los bajíos.<br>🔥 Toca un <b>brasero encendido</b> para llevar fuego. Sirve para encender braseros y quemar zarzas, pero dura pocos pasos.<br>🪞 Los <b>espejos</b> giran al tocarlos. Lleva la luz de los cristales a los diamantes apagados para abrir verjas.<br>🪨 Las <b>rocas redondas</b> ruedan hasta chocar. En la lava, la enfrían y hacen camino. Tocar la lava te da fuego.<br>↩️ <b>Atrás</b> deshace el último paso y ⟳ reinicia la sala.</div></div>';
  $('diaryBody').innerHTML = h;
  $('diaryBody').querySelectorAll('canvas[data-p]').forEach(c => { if (c.dataset.p) drawPortrait(c.getContext('2d'), c.dataset.p, 128, 1); });
  show('diary');
}
$('diaryBack').onclick = () => { AU.play('tap'); if (diaryFrom === 'game' && G.room) show('game'); else show('menu'); };

// ---------- instalación ----------
let deferredInstall = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('bInst').classList.add('on'); });
$('bInst').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { } deferredInstall = null; $('bInst').classList.remove('on'); };
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && window.top === window.self) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }

// ---------- bucle ----------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const pr = document.createElement('div'); pr.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden';
  document.body.appendChild(pr); const cs = getComputedStyle(pr); SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.b = parseFloat(cs.paddingBottom) || 0; pr.remove();
  if (G.room) { G.lay = roomLayout(); rebuildGround(); }
}
addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.scr === 'game' && G.room) {
    const s = G.room.st;
    // mover visual
    const q = Math.min(1, (now - G.moveT0) / G.STEP);
    if (G.from && q < 1) { G.vis.x = G.from.x + (ix(s.p) - G.from.x) * q; G.vis.y = G.from.y + (iy(s.p) - G.from.y) * q; G.walkPh += dt * 7; }
    else { G.vis.x = ix(s.p); G.vis.y = iy(s.p); if (!G.queue.length) G.walkPh = 0; }
    if (q >= 1 && G.queue.length && !G.dlg && !G.busy && !$('m-pause').classList.contains('on')) performMove(G.queue.shift());
    G.tideK += (s.tide - G.tideK) * Math.min(1, dt * 2.2);
    G.gateK += ((gateOpen(s) ? 1 : 0) - G.gateK) * Math.min(1, dt * 8);
    G.bellSwing = Math.max(0, G.bellSwing - dt * 0.6);
    G.shake = Math.max(0, G.shake - dt * 30);
    for (const f of G.ambient) { f.p += dt; f.x += Math.sin(f.p * 0.7) * dt * 0.4; f.y += Math.cos(f.p * 0.9) * dt * 0.3; f.a = (Math.sin(f.p * 2) + 1) / 2; if (f.x < 0) f.x += RW; if (f.x > RW) f.x -= RW; if (f.y < 0) f.y += RH; if (f.y > RH) f.y -= RH; }
    if (G.room.theme === 'bosque' && Math.random() < dt * 0.8) addP({ k: 'dust', x: Math.random() * RW, y: -0.5, vx: 0.3, vy: 0.8, life: 6000, col: 'rgba(160,190,90,.7)', sz: 0.05 });
    renderRoom(now);
  } else if (G.scr === 'map') renderMap(now);
  else renderMenu(now);
  dlgTick(now);
  requestAnimationFrame(frame);
}
resize(); refreshMenu(); show('menu');
AU.on.mus = SV.set.mus; AU.on.sfx = SV.set.sfx;
requestAnimationFrame(frame);
window.__mar = { skip() { let n = 0; while (G.dlg && n++ < 50) { G.dlg.ch = 1e9; dlgNext(); } }, G, SV: () => SV, ROOMS, enterRoom, performMove, idx, talk, openMap, dlgNext };
