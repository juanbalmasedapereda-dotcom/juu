<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Órbita">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Órbita</title>
<style>
:root{
  --bg:#060816; --ink:#eaf2ff; --dim:#8d9bc4; --cy:#5ef2ff; --mg:#ff5ec8; --au:#ffd36e; --vi:#9b7bff; --gr:#6dffb0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;visibility:hidden;
  transform:scale(1.04);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.25,1),visibility 0s linear .45s;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px)}
.scr.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.25,1),visibility 0s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:active{transform:scale(.96)}
.ico{width:22px;height:22px;display:block;flex:none}

/* ---------- MENÚ ---------- */
#scr-menu{justify-content:space-between}
.logo{margin-top:min(9vh,70px);text-align:center;position:relative}
.logo-t{font-size:clamp(54px,17vw,86px);font-weight:900;letter-spacing:.06em;line-height:1;
  background:linear-gradient(100deg,#fff 0%,#9ff7ff 25%,#c7a6ff 50%,#ff8fd8 70%,#fff 90%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;
  filter:drop-shadow(0 0 18px rgba(120,200,255,.45)) drop-shadow(0 4px 0 rgba(30,20,80,.6))}
@keyframes shine{0%{background-position:100% 0}100%{background-position:-150% 0}}
.logo-s{margin-top:8px;font-size:13px;letter-spacing:.5em;text-transform:uppercase;color:#b9c7ff;opacity:.85;padding-left:.5em}
.logo-in .logo-t{animation:shine 6s linear infinite,logoin 1.1s cubic-bezier(.2,1.4,.3,1) both}
.logo-in .logo-s{animation:fadeup .8s .5s both}
@keyframes logoin{0%{opacity:0;transform:translateY(-30px) scale(.7);letter-spacing:.5em}100%{opacity:1;transform:none}}
@keyframes fadeup{0%{opacity:0;transform:translateY(14px)}100%{opacity:.85;transform:none}}
.menu-btns{width:min(100%,400px);display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.menu-btns>*{animation:fadeup2 .6s both}
.menu-btns>*:nth-child(1){animation-delay:.35s}.menu-btns>*:nth-child(2){animation-delay:.45s}.menu-btns>*:nth-child(3){animation-delay:.55s}.menu-btns>*:nth-child(4){animation-delay:.65s}
@keyframes fadeup2{0%{opacity:0;transform:translateY(26px)}100%{opacity:1;transform:none}}
.bigplay{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:24px;min-height:78px;overflow:hidden;text-align:left;
  background:linear-gradient(120deg,#2be0ff 0%,#6a7bff 45%,#c35cff 100%);box-shadow:0 10px 30px rgba(90,110,255,.45),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(30,10,90,.35)}
.bigplay::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.6s 1.2s infinite}
@keyframes sweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.bigplay .pic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);flex:none}
.bigplay .pic svg{width:24px;height:24px;margin-left:3px}
.bigplay b{display:block;font-size:24px;font-weight:900;letter-spacing:.02em;text-shadow:0 2px 0 rgba(20,10,80,.35)}
.bigplay small{display:block;font-size:13px;opacity:.92;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:20px;min-height:96px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,rgba(40,52,110,.85),rgba(16,20,48,.85));box-shadow:inset 0 0 0 1px rgba(150,170,255,.22),0 8px 22px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mode .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.mode .mi svg{width:22px;height:22px}
.mode b{font-size:16px;font-weight:900}
.mode small{font-size:12px;color:var(--dim);font-weight:700;line-height:1.25}
.mode.daily .mi{background:linear-gradient(140deg,#ffd36e,#ff8a5c);box-shadow:0 0 18px rgba(255,180,90,.5)}
.mode.nova .mi{background:linear-gradient(140deg,#ff5ec8,#9b7bff);box-shadow:0 0 18px rgba(255,94,200,.5)}
.mode .tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:900;padding:3px 7px;border-radius:99px;background:rgba(255,211,110,.18);color:var(--au)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:66px;border-radius:18px;font-size:12px;font-weight:800;color:#c9d4ff;
  background:rgba(22,28,64,.75);box-shadow:inset 0 0 0 1px rgba(150,170,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative}
.sq svg{width:24px;height:24px}
.dot{position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--mg);box-shadow:0 0 8px var(--mg);display:none}
.dot.on{display:block}
.menu-foot{display:flex;gap:10px;justify-content:center;font-size:13px;font-weight:800;color:#b9c7ff;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(20,26,60,.7);box-shadow:inset 0 0 0 1px rgba(150,170,255,.18)}
.pill svg{width:15px;height:15px}

/* ---------- CABECERA COMÚN ---------- */
.hdr{width:min(100%,480px);display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:8px}
.hdr h2{margin:0;font-size:22px;font-weight:900;flex:1;letter-spacing:.02em}
.back{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(22,28,64,.8);box-shadow:inset 0 0 0 1px rgba(150,170,255,.22);flex:none}
.back svg{width:22px;height:22px}
.scroll{width:min(100%,480px);flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:10px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- SECTORES ---------- */
.tabs{width:min(100%,480px);display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;padding:2px 2px 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px;border-radius:99px;font-size:13px;font-weight:900;background:rgba(22,28,64,.75);color:#aab6e8;box-shadow:inset 0 0 0 1px rgba(150,170,255,.18);min-height:44px;display:flex;align-items:center;gap:6px}
.tab.on{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;box-shadow:0 4px 16px var(--c3)}
.tab.lock{opacity:.5}
.sector{position:relative;border-radius:26px;overflow:hidden;padding:16px;background:linear-gradient(170deg,rgba(30,38,90,.9),rgba(10,12,32,.92));box-shadow:inset 0 0 0 1px rgba(150,170,255,.2),0 12px 30px rgba(0,0,0,.4)}
.sector .art{position:absolute;right:-30px;top:-30px;width:190px;height:190px;pointer-events:none}
.sector h3{margin:0;font-size:24px;font-weight:900;position:relative;max-width:65%}
.sector p{margin:4px 0 0;font-size:13px;color:#b3bfe8;font-weight:700;position:relative;max-width:62%;line-height:1.35}
.sector .prog{position:relative;margin-top:12px;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:900}
.bar{flex:1;max-width:160px;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;position:relative}
.lv{position:relative;aspect-ratio:1/1.08;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(160deg,rgba(60,74,150,.6),rgba(20,24,60,.8));box-shadow:inset 0 0 0 1.5px rgba(160,180,255,.25),0 6px 14px rgba(0,0,0,.3)}
.lv b{font-size:22px;font-weight:900;line-height:1}
.lv .st{display:flex;gap:1px}
.lv .st svg{width:13px;height:13px}
.lv.cur{background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 22px var(--c3);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 34px var(--c3)}}
.lv.lock{opacity:.45}
.lv.lock b{display:none}
.lv.boss{grid-column:span 2;aspect-ratio:auto;flex-direction:row;gap:10px;background:linear-gradient(140deg,rgba(255,90,140,.35),rgba(90,30,120,.6));box-shadow:inset 0 0 0 1.5px rgba(255,140,190,.45),0 6px 14px rgba(0,0,0,.3)}
.lv.boss svg.sk{width:30px;height:30px}
.lv.boss .bt{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.lv.boss .bt b{font-size:15px}
.lv.boss.cur{background:linear-gradient(140deg,#ff5e8a,#9b3bff)}
.slock{position:relative;margin-top:16px;padding:18px;border-radius:18px;background:rgba(0,0,0,.25);text-align:center;font-weight:800;color:#c4cdf0;font-size:14px;line-height:1.4}

/* ---------- HUD ---------- */
#hud{padding:0;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px);display:flex;align-items:flex-start;gap:10px}
.hb{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(14,18,44,.72);box-shadow:inset 0 0 0 1px rgba(150,170,255,.25);pointer-events:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);flex:none}
.hb svg{width:22px;height:22px}
.hmid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px}
.hname{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#aebbe8;white-space:nowrap}
.hchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.hc{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:rgba(14,18,44,.72);box-shadow:inset 0 0 0 1px rgba(150,170,255,.22);font-size:13px;font-weight:900;white-space:nowrap}
.hc svg{width:14px;height:14px}
.hc.warn{color:#ffb3c8;box-shadow:inset 0 0 0 1px rgba(255,120,160,.5)}
.dusts{display:flex;gap:3px}
.dusts i{width:12px;height:12px;display:block;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);background:rgba(255,255,255,.18)}
.dusts i.on{background:var(--au);filter:drop-shadow(0 0 4px var(--au))}
#hint{position:absolute;left:50%;top:calc(var(--sat) + 96px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);text-align:center;font-size:15px;font-weight:800;padding:10px 16px;border-radius:16px;
  background:rgba(14,18,44,.75);box-shadow:inset 0 0 0 1px rgba(150,170,255,.25);opacity:0;transition:opacity .4s;line-height:1.35}
#hint.on{opacity:1}
.tipb{position:absolute;left:50%;bottom:calc(var(--sab) + 18px);transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;padding:0 18px;min-height:48px;border-radius:99px;font-weight:900;font-size:15px;color:#ffe9a0;
  background:rgba(40,30,10,.8);box-shadow:inset 0 0 0 1.5px rgba(255,211,110,.55),0 0 20px rgba(255,211,110,.25);transition:opacity .3s,transform .4s cubic-bezier(.2,1.6,.3,1)}
.tipb svg{width:22px;height:22px}
.tipb.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#bossin{position:absolute;left:0;right:0;top:40%;text-align:center;opacity:0;pointer-events:none;padding:14px 0;background:linear-gradient(90deg,transparent,rgba(120,10,60,.75) 20%,rgba(120,10,60,.75) 80%,transparent)}
#bossin small{display:block;font-size:13px;font-weight:900;letter-spacing:.5em;color:#ffb3d0;padding-left:.5em}
#bossin b{display:block;font-size:clamp(22px,8vw,32px);padding:0 10px;font-weight:900;color:#fff;text-shadow:0 0 18px #ff5e8a}
#bossin.go{animation:bossin 2.4s ease both}
@keyframes bossin{0%{opacity:0;transform:scaleY(0)}12%{opacity:1;transform:scaleY(1.15)}20%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#hud.boss #hint{top:calc(var(--sat) + 122px)}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;letter-spacing:.04em;white-space:nowrap;opacity:0;pointer-events:none;text-shadow:0 0 18px currentColor}
#toast.go{animation:toast 1.3s ease-out both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
#bosshp{position:absolute;left:50%;top:calc(var(--sat) + 88px);transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px;width:min(70%,300px)}
#bosshp.on{display:flex}
#bosshp span{font-size:11px;font-weight:900;letter-spacing:.2em;color:#ff9fc4;text-transform:uppercase}
#bosshp .bar{flex:none;width:100%;max-width:none;height:9px;box-shadow:inset 0 0 0 1px rgba(255,130,180,.4)}
#bosshp .bar i{background:linear-gradient(90deg,#ff5e8a,#ffb36e);transition:width .4s}

/* ---------- MODALES ---------- */
.modal{justify-content:center;background:rgba(4,6,18,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.card{width:min(100%,380px);border-radius:28px;padding:22px 18px 18px;position:relative;text-align:center;
  background:linear-gradient(170deg,rgba(38,48,110,.96),rgba(12,14,38,.97));box-shadow:inset 0 0 0 1px rgba(160,180,255,.28),0 20px 60px rgba(0,0,0,.6)}
.modal.on .card{animation:pop .5s cubic-bezier(.2,1.5,.35,1) both}
@keyframes pop{0%{transform:scale(.7) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.card h2{margin:0 0 4px;font-size:28px;font-weight:900}
.card .sub{color:#b5c1ea;font-weight:700;font-size:14px;margin-bottom:12px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:8px 0 12px;height:84px}
.stars .s{width:64px;height:64px;opacity:.18;filter:grayscale(1)}
.stars .s:nth-child(2){width:80px;height:80px}
.stars .s.on{opacity:1;filter:drop-shadow(0 0 14px rgba(255,211,110,.8));animation:starin .6s cubic-bezier(.2,1.8,.3,1) both}
@keyframes starin{0%{transform:scale(0) rotate(-120deg)}100%{transform:none}}
.rows{display:flex;flex-direction:column;gap:7px;margin:4px 0 14px}
.rw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:14px;font-weight:800;text-align:left}
.rw .k{flex:1;color:#c2cdf2;min-width:0}
.rw .v{font-weight:900}
.rw svg{width:18px;height:18px;flex:none}
.rw.ok .v{color:var(--gr)}.rw.no .v{color:#8a93b8}
.btns{display:flex;gap:10px}
.btn{flex:1;min-height:54px;border-radius:18px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(170,190,255,.25)}
.btn svg{width:20px;height:20px}
.btn.pri{background:linear-gradient(120deg,#2be0ff,#6a7bff 55%,#c35cff);box-shadow:0 8px 22px rgba(90,110,255,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.sm{flex:0 0 54px}
.btn.wide{width:100%}
.col{display:flex;flex-direction:column;gap:10px}
.newrec{display:inline-block;margin-top:2px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:900;background:linear-gradient(90deg,#ffd36e,#ff8a5c);color:#2a1400;animation:pulse2 1s infinite}
@keyframes pulse2{50%{transform:scale(1.08)}}
.reward{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--au);font-size:15px;margin-bottom:12px}
.reward svg{width:18px;height:18px}

/* ---------- HANGAR / LOGROS / AJUSTES ---------- */
.wallet{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:rgba(20,26,60,.8);box-shadow:inset 0 0 0 1px rgba(255,211,110,.35);font-weight:900;font-size:14px;color:var(--au)}
.wallet svg{width:16px;height:16px}
.prev{position:relative;height:190px;border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,rgba(80,90,200,.35),rgba(8,10,28,.9) 70%);box-shadow:inset 0 0 0 1px rgba(150,170,255,.22);margin-bottom:12px}
.prev canvas{width:100%;height:100%;display:block}
.prev .pn{position:absolute;left:16px;bottom:12px;text-align:left}
.prev .pn b{display:block;font-size:22px;font-weight:900}
.prev .pn small{font-size:13px;color:#b8c4ee;font-weight:700}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skin{position:relative;border-radius:18px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(22,28,64,.75);box-shadow:inset 0 0 0 1px rgba(150,170,255,.18);min-height:112px}
.skin canvas{width:64px;height:64px}
.skin b{font-size:12.5px;font-weight:900}
.skin small{font-size:11px;font-weight:800;color:var(--dim);display:flex;align-items:center;gap:3px}
.skin small svg{width:11px;height:11px}
.skin.sel{box-shadow:inset 0 0 0 2px var(--cy),0 0 18px rgba(94,242,255,.35)}
.skin.lock canvas{opacity:.6}
.ach{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(22,28,64,.75);box-shadow:inset 0 0 0 1px rgba(150,170,255,.16);margin-bottom:9px}
.med{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#4a5490,#1a1e44);box-shadow:inset 0 0 0 2px rgba(150,170,255,.25)}
.med svg{width:24px;height:24px;opacity:.4}
.ach.ok .med{background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc34a 45%,#c77a10);box-shadow:0 0 16px rgba(255,200,80,.5),inset 0 0 0 2px rgba(255,255,255,.6)}
.ach.ok .med svg{opacity:1}
.ach .tx{flex:1;min-width:0}
.ach b{display:block;font-size:15px;font-weight:900}
.ach small{display:block;font-size:12.5px;color:var(--dim);font-weight:700;line-height:1.3}
.ach .pr{font-size:12px;font-weight:900;color:#c9d4ff;white-space:nowrap}
.set{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(22,28,64,.75);box-shadow:inset 0 0 0 1px rgba(150,170,255,.16);margin-bottom:9px;min-height:62px}
.set{flex-wrap:wrap}.set .tx{flex:1;min-width:150px}
.set b{display:block;font-size:15px;font-weight:900}
.set small{display:block;font-size:12.5px;color:var(--dim);font-weight:700;line-height:1.3}
.tg{width:58px;height:34px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.4,1);box-shadow:0 2px 6px rgba(0,0,0,.4)}

<script>
'use strict';
/* =========================================================
   ÓRBITA — golf espacial con gravedad. Un solo archivo.
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hashStr(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------------- GUARDADO ---------------- */
const SAVE_KEY = 'orbita-v1';
const DEF = { lv: {}, dust: 0, dustTotal: 0, skin: 'hielo', skins: ['hielo'], ach: {}, snd: true, mus: true, vib: true, guide: 1,
  nova: 0, novaLv: 0, daily: {}, stats: { shots: 0, wins: 0, crashes: 0, bh: 0, holes: 0, perfect: 0, bosses: 0, novaRuns: 0, dailies: 0, dustGot: 0 }, seenH: 0, seenL: 0 };
let S;
try { S = Object.assign(structuredClone(DEF), JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); S.stats = Object.assign(structuredClone(DEF.stats), S.stats || {}); } catch (e) { S = structuredClone(DEF); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------------- CANVAS ---------------- */
const cv = $('#cv'); let cx = cv.getContext('2d');
let DPR = 1, SW = 0, SH = 0;      // tamaño de pantalla en px CSS
const WW = 360, WH = 640;         // mundo lógico
let VS = 1, VX = 0, VY = 0;       // vista: escala y desplazamiento
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  SW = innerWidth; SH = innerHeight;
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  // margen para el HUD arriba (seguro) y abajo
  const topPad = 92, botPad = 30;
  VS = Math.min(SW / WW, (SH - topPad - botPad) / WH);
  VX = (SW - WW * VS) / 2;
  VY = topPad + ((SH - topPad - botPad) - WH * VS) / 2;
  buildBg();
}
addEventListener('resize', resize);

/* ---------------- FONDO ESTRELLADO ---------------- */
let bgLayers = [], bgNeb = null, bgSeedCol = ['#3a2a8a', '#0a5a8a', '#8a2a6a'];
function buildBg() {
  const w = Math.ceil(SW * DPR), h = Math.ceil(SH * DPR);
  bgLayers = [];
  const R = rng(7);
  for (let L = 0; L < 3; L++) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    const n = Math.round((SW * SH) / (L === 0 ? 900 : L === 1 ? 2600 : 7000));
    for (let i = 0; i < n; i++) {
      const x = R() * w, y = R() * h, r = (L === 0 ? .35 + R() * .6 : L === 1 ? .6 + R() * .8 : 1 + R() * 1.2) * DPR;
      const hue = R() < .2 ? 'rgba(255,220,180,' : R() < .4 ? 'rgba(170,200,255,' : 'rgba(255,255,255,';
      g.fillStyle = hue + (L === 0 ? .25 + R() * .4 : .5 + R() * .5) + ')';
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      if (L === 2 && R() < .5) { g.strokeStyle = hue + '.35)'; g.lineWidth = .6 * DPR; g.beginPath(); g.moveTo(x - r * 4, y); g.lineTo(x + r * 4, y); g.moveTo(x, y - r * 4); g.lineTo(x, y + r * 4); g.stroke(); }
    }
    bgLayers.push(c);
  }
  setNebula(bgSeedCol);
}
function setNebula(cols) {
  bgSeedCol = cols;
  const w = Math.ceil(SW * DPR / 3), h = Math.ceil(SH * DPR / 3);
  if (!w || !h) return;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const R = rng(hashStr(cols.join()));
  g.fillStyle = '#060816'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9; i++) {
    const x = R() * w, y = R() * h, r = (0.35 + R() * 0.6) * Math.max(w, h);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const col = cols[i % cols.length];
    gr.addColorStop(0, col + '66'); gr.addColorStop(.5, col + '22'); gr.addColorStop(1, col + '00');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }
  bgNeb = c;
}
function drawBg(t, par = 1) {
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (bgNeb) cx.drawImage(bgNeb, 0, 0, cv.width, cv.height); else { cx.fillStyle = '#060816'; cx.fillRect(0, 0, cv.width, cv.height); }
  const w = cv.width, h = cv.height;
  for (let L = 0; L < bgLayers.length; L++) {
    const sp = (L + 1) * 4 * par * DPR;
    const oy = (t * sp) % h;
    cx.globalAlpha = L === 2 ? .75 + .25 * Math.sin(t * 1.3) : 1;
    cx.drawImage(bgLayers[L], 0, oy); cx.drawImage(bgLayers[L], 0, oy - h);
  }
  cx.globalAlpha = 1;
}

/* ---------------- AUDIO (sintetizado) ---------------- */
let AC = null, master = null, musGain = null, sfxGain = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.gain.value = S.snd ? .7 : 0; sfxGain.connect(master);
    musGain = AC.createGain(); musGain.gain.value = S.mus ? .32 : 0; musGain.connect(master);
    startMusic();
  } catch (e) { AC = null; }
}
function tone(f, d = .15, type = 'sine', v = .3, f2 = 0, delay = 0) {
  if (!AC || !S.snd) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + d + .05);
}
function noise(d = .3, v = .3, fc = 1200, q = 1, f2 = 0) {
  if (!AC || !S.snd) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b; const fl = AC.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.setValueAtTime(fc, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d); fl.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(fl); fl.connect(g); g.connect(sfxGain); s.start(t);
}
const PENTA = [0, 2, 4, 7, 9];
const SFX = {
  ui() { tone(880, .07, 'triangle', .12); },
  back() { tone(520, .08, 'triangle', .12, 400); },
  stretch(p) { tone(200 + p * 500, .04, 'sine', .04); },
  launch(p) { noise(.45, .25 + p * .2, 600, 1.2, 3000); tone(180, .3, 'triangle', .15, 520 + p * 300); },
  dust(i) { const f = 660 * Math.pow(2, PENTA[i % 5] / 12 + Math.floor(i / 5)); tone(f, .35, 'sine', .22); tone(f * 2, .25, 'triangle', .06, 0, .03); },
  crash() { noise(.6, .5, 400, .8, 80); tone(120, .4, 'sawtooth', .12, 40); vib(60); },
  bh() { tone(300, 1.1, 'sine', .25, 40); noise(1, .2, 200, 2, 60); vib([30, 40, 60]); },
  station() { tone(523, .12, 'triangle', .18); tone(784, .2, 'triangle', .16, 0, .08); vib(15); },
  warp() { tone(200, .5, 'sine', .2, 1600); tone(1600, .5, 'sine', .1, 200); },
  win() { [0, 4, 7, 12, 16].forEach((n, i) => tone(523 * Math.pow(2, n / 12), .5, 'triangle', .18, 0, i * .09)); vib([20, 30, 20]); },
  star(i) { tone(784 * Math.pow(2, i * 4 / 12), .4, 'sine', .22); tone(1568 * Math.pow(2, i * 4 / 12), .3, 'triangle', .06); },
  hit() { tone(140, .3, 'square', .14, 60); noise(.25, .35, 900, 1, 200); vib(40); },
  bossdie() { for (let i = 0; i < 6; i++) tone(400 - i * 50, .4, 'sawtooth', .1, 60, i * .08); noise(1.2, .4, 500, .6, 60); vib([60, 40, 120]); },
  lost() { tone(400, .35, 'sine', .14, 150); },
};
function vib(p) { if (S.vib && navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
/* música generativa: pad + arpegio suave pentatónico */
let musTimer = null, musStep = 0, musKey = 0;
const MUS_KEYS = [[0, 3, 7, 10], [5, 8, 12, 15], [3, 7, 10, 14], [-2, 2, 5, 9]];
function startMusic() {
  if (!AC || musTimer) return;
  const pad = (root, t) => {

function placeAt(lv, t) {
  for (const p of lv.planets) {
    if (p.orb) { const [ox, oy, R, w, ph] = p.orb; p.x = ox + Math.cos(ph + t * w) * R; p.y = oy + Math.sin(ph + t * w) * R; }
    p.rot = t;
  }
  for (const m of lv.moons) { const p = lv.planets[m.pi]; m.x = p.x + Math.cos(m.ph + t * m.w) * m.R; m.y = p.y + Math.sin(m.ph + t * m.w) * m.R; }
  for (const a of lv.ast) { if (a.orb) { const [ox, oy, R, w, ph] = a.orb; a.x = ox + Math.cos(ph + t * w) * R; a.y = oy + Math.sin(ph + t * w) * R; } }
  for (const f of lv.foes) {
    if (f.circ) { f.x = f.x1 + Math.cos(f.ph + t * f.v) * f.x2; f.y = f.y1 + Math.sin(f.ph + t * f.v) * f.x2; }
    else { const k = (Math.sin(f.ph + t * f.v * 1.6) + 1) / 2; f.x = lerp(f.x1, f.x2, k); f.y = lerp(f.y1, f.y2, k); }

  if (b) placeBoss(b, t);

  if (b.kind === 'anillo') { b.x = 180; b.y = 250; const open = (Math.sin(t * .9) + 1) / 2; b.open = open; b.cores.forEach((c, i) => { const a = c.a + t * .45; const d = 30 + open * 80; c.x = b.x + Math.cos(a) * d; c.y = b.y + Math.sin(a) * d; }); }
  if (b.kind === 'ojo') { b.x = 180 + Math.sin(t * .35) * 40; b.y = 250; b.cores.forEach((c, i) => { const a = c.a - t * .55; c.x = b.x + Math.cos(a) * c.d; c.y = b.y + Math.sin(a) * c.d; }); }
  if (b.kind === 'sol') { b.x = 180; b.y = 240 + Math.sin(t * .6) * 20; b.cores.forEach((c, i) => { const a = c.a + t * .5; c.x = b.x + Math.cos(a) * c.d; c.y = b.y + Math.sin(a) * c.d; }); }

/* Avanza un paso. Devuelve null o un evento {e:'crash'|'bh'|'win'|'lost'|'station'|'dust'|'warp'|'eaten'|'core'} */
function stepComet(lv, c, dt, t, sim) {
  const [ax, ay] = accel(lv, c.x, c.y);

  if (c.x < -170 || c.x > WW + 170 || c.y < -200 || c.y > WH + 200) return { e: 'lost' };

}

/* ---------- Bot resolvedor (para verificar niveles y fijar el par) ---------- */
function simulate(L, from, ang, pow, t0, opts = {}) {
  const lv = L.planets ? L : buildLevel(L);

  for (let i = 0; i < T_MAX / DT + 2; i++) {
    t += DT; placeAt(lv, t);
    const ev = stepComet(lv, c, DT, t, true);
    lv.dust.forEach((d, j) => { if (!got.has(j) && (d.x - c.x) ** 2 + (d.y - c.y) ** 2 < 17 * 17) got.add(j); });
    if (ev && ev.e !== 'warp') return { e: ev.e, o: ev.o, x: c.x, y: c.y, t, dust: got };
  }
  return { e: 'lost', dust: got };
}
function solveLevel(L, t0 = 0, angStep = 1.5, powSteps = 16) {
  // búsqueda en anchura por estaciones; devuelve tiros mínimos y tasa de éxito del primer tramo
  const lv = buildLevel(L);
  const nodes = [{ pos: lv.start, st: null, shots: 0 }];
  const seen = new Set(['start']);
  let total = 0, okFirst = 0, best = null, dustMax = 0;
  for (let q = 0; q < nodes.length && q < 12; q++) {
    const nd = nodes[q];
    for (let a = 0; a < 360; a += angStep) for (let k = 1; k <= powSteps; k++) {
      const r = simulate(L, nd.pos, a * Math.PI / 180, k / powSteps, t0, { fromSt: nd.st ? lv.stations.find(s => s.x === nd.st.x && s.y === nd.st.y) : null });
      if (q === 0) total++;
      if (r.e === 'win') { if (q === 0) okFirst++; if (!best || nd.shots + 1 < best) best = nd.shots + 1; dustMax = Math.max(dustMax, r.dust.size); }
      if (r.e === 'station') { const id = r.o.x + ',' + r.o.y; if (!seen.has(id)) { seen.add(id); nodes.push({ pos: { x: r.o.x, y: r.o.y }, st: r.o, shots: nd.shots + 1 }); } }
    }
  }
  return { best, rate: okFirst / total, dustMax };
}

/* ---------- Entrada táctil: tirachinas ---------- */
const MAXDRAG = () => Math.min(130, SW * .34);

});

  if (!ptr || ptr.id !== e.pointerId || !G_ || !G_.aim) return;
  ptr.x = e.clientX; ptr.y = e.clientY;

}

function launch(a) {

/* ---------- Bucle principal ---------- */
function frame(now) {
  requestAnimationFrame(frame);

  T += dtr;
  if (scene === 'play' && G_ && !G_.paused) update(dtr);
  render(dtr);
}
function update(dtr) {
  const g = G_;
  g.intro = Math.max(0, g.intro - dtr);
  g.spawnT = Math.max(0, g.spawnT - dtr * 2);
  acc += dtr;
  while (acc >= DT) {
    acc -= DT;
    g.t += DT;
    placeAt(g.lv, g.t);
    if (g.lv.boss) bossTick(g, DT);
    if (g.state === 'fly') {
      const ev = stepComet(g.lv, g.comet, DT, g.t, false);
      if (!ev) { const c = g.comet; for (const p of g.lv.planets) { const d = Math.hypot(p.x - c.x, p.y - c.y) - p.r; if (d < 9) c.close = 1; else if (c.close === 1 && d > 30) { c.close = 2; toast('¡Por los pelos!', '#9ff7ff', 22); SFX.station(); } } }
      if (ev) onEvent(ev);
    }
  }
  if (g.state === 'fly') {
    const c = g.comet; g.trail.push({ x: c.x, y: c.y }); if (g.trail.length > 70) g.trail.shift();
    const sp = Math.hypot(c.vx, c.vy);
    if (Math.random() < .9) parts.push({ x: c.x + (Math.random() - .5) * 4, y: c.y + (Math.random() - .5) * 4, vx: -c.vx * .08 + (Math.random() - .5) * 20, vy: -c.vy * .08 + (Math.random() - .5) * 20, l: .5 + Math.random() * .5, ml: 1, r: 1.5 + Math.random() * 2.4, c: skinCol(Math.random()), add: 1 });
  }

  if (g.state === 'won') { g.winT -= dtr; if (g.winT <= 0 && !g.winShown) { g.winShown = true; showWin(); } }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.l -= dtr / p.ml; p.x += p.vx * dtr; p.y += p.vy * dtr; p.vx *= .97; p.vy *= .97; if (p.l <= 0) parts.splice(i, 1); }

      SFX.station(); ring(s.x, s.y, '#6dffb0'); burst(s.x, s.y, 16, '#6dffb0', 100, .5);
      c.x = s.x; c.y = s.y; c.vx = c.vy = 0; g.state = 'aim'; c.from = s; g.trail = []; g.spawnT = .6;

function showWin() {
  const g = G_;
  const allDust = g.lv.dust.length > 0 && g.lv.dust.every(d => d.got);
  const underPar = g.shots <= g.lv.par;
  let st = 1 + (underPar ? 1 : 0) + (allDust || (g.lv.boss && g.crashes === 0) ? 1 : 0);
  if (g.lv.boss) st = 1 + (g.shots <= g.lv.par ? 1 : 0) + (g.crashes <= 1 ? 1 : 0);
  if (g.usedTip) st = Math.min(st, 2);
  const dustN = g.lv.dust.filter(d => d.got).length;
  S.stats.wins++;
  let title = st === 3 ? '¡Órbita perfecta!' : st === 2 ? '¡Muy bien!' : '¡Conseguido!';
  if (g.lv.boss) title = '¡Jefe derrotado!';
  let extra = '';
  if (g.mode === 'camp') {
    const k = lvKey(g.idx), prev = S.lv[k];
    const prevDust = prev ? prev.dust || 0 : 0;
    const gain = Math.max(0, dustN - prevDust) * 10 + (prev ? 0 : 10) + Math.max(0, st - (prev ? prev.st : 0)) * 5;
    S.lv[k] = { st: Math.max(st, prev ? prev.st : 0), best: Math.min(g.shots, prev ? prev.best : 99), dust: Math.max(dustN, prevDust) };
    S.dust += gain; S.dustTotal += gain;
    if (st === 3) S.stats.perfect++;
    if (gain) extra = '<div class="reward"><svg viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#9ff7ff"/></svg>+' + gain + ' polvo estelar</div>';
    $('#w-sub').textContent = lvName(g.idx) + ' · ' + g.L.n;
    $('#w-next').style.display = g.idx + 1 < LEVELS.length ? '' : 'none';
  } else if (g.mode === 'daily') {
    const dk = dayKey(); const prev = S.daily[dk]; const isRec = !prev || g.shots < prev;
    if (!prev) S.stats.dailies++;
    if (isRec) S.daily[dk] = g.shots;
    const gain = prev ? 0 : 30 + dustN * 10; S.dust += gain; S.dustTotal += gain;
    title = '¡Desafío superado!';
    extra = (isRec && prev ? '<div class="newrec">¡Mejor marca de hoy!</div><br>' : '') + (gain ? '<div class="reward" style="margin-top:6px"><svg viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="#9ff7ff"/></svg>+' + gain + ' polvo estelar</div>' : '');

/* ---------- Generador procedural (Desafío diario y Supernova) ---------- */
function genLevel(seed, diff) {
  const R = rng(seed);
  for (let tries = 0; tries < 40; tries++) {
    const L = { n: 'Procedural', s: [40 + R() * 280, 590], g: [40 + R() * 280, 90], par: 1, p: [], d: [], bh: [], a: [], m: [], st: [], w: [], f: [] };
    const types = Object.keys(PT);
    const np = 1 + Math.floor(R() * (1.5 + diff * 2.5));
    for (let i = 0; i < np; i++) {
      let ok = false;
      for (let k = 0; k < 20 && !ok; k++) {
        const r = 22 + R() * (30 + 20 * (1 - diff)), x = 50 + R() * 260, y = 170 + R() * 300;
        ok = L.p.every(p => Math.hypot(p[0] - x, p[1] - y) > p[2] + r + 50) && Math.hypot(x - L.s[0], y - L.s[1]) > r + 60 && Math.hypot(x - L.g[0], y - L.g[1]) > r + 60;
        if (ok) L.p.push([x, y, r, types[Math.floor(R() * types.length)], .8 + R() * .5]);
      }
    }
    if (diff > .35 && R() < .5) { const pi = Math.floor(R() * L.p.length); if (L.p[pi]) L.m.push([pi, L.p[pi][2] + 28 + R() * 20, (R() < .5 ? -1 : 1) * (.5 + R() * .6), 9 + R() * 5, R() * 6]); }
    if (diff > .5 && R() < .4) { const x = 80 + R() * 200, y = 220 + R() * 200; if (L.p.every(p => Math.hypot(p[0] - x, p[1] - y) > p[2] + 80)) L.bh.push([x, y, .4 + R() * .4]); }
    if (diff > .6 && R() < .35) { const y = 200 + R() * 260; L.f.push([50, y, 310, y, .4 + R() * .5]); }
    // polvo: puntos de una trayectoria válida
    L.g = [L.g[0], L.g[1]];
    const lv = buildLevel(L);
    const sol = [];
    for (let a = 200; a < 340; a += 2.5) for (let k = 4; k <= 16; k += 1) { const r = simulate(lv, lv.start, a * Math.PI / 180, k / 16, 0); if (r.e === 'win') sol.push([a, k]); }
    lv.dust.length = 0;
    const total = 56 * 13, rate = sol.length / total;
    const target = .25 - diff * .2;
    if (!sol.length || rate > target + .12) continue;
    // ¿el tiro recto directo funciona? si es muy fácil, repetir
    const pick = sol[Math.floor(R() * sol.length)];
    const path = tracePath(L, pick[0] * Math.PI / 180, pick[1] / 16);
    if (path.length > 30) { for (const f of [.3, .55, .8]) { const q = path[Math.floor(path.length * f)]; L.d.push([Math.round(q.x), Math.round(q.y)]); } }
    L.par = 1 + (diff > .6 ? 1 : 0);
    return L;
  }
  return { n: 'Procedural', s: [180, 590], g: [180, 90], par: 1, p: [[180, 330, 50, 'oceano']], d: [[100, 330], [260, 330], [180, 180]] };
}
function tracePath(L, ang, pow) {
  const lv = buildLevel(L); const c = { x: lv.start.x, y: lv.start.y, vx: Math.cos(ang) * pow * VMAX, vy: Math.sin(ang) * pow * VMAX, ft: 0, warpCd: 0 };
  const pts = []; let t = 0;
  for (let i = 0; i < T_MAX / DT; i++) { t += DT; placeAt(lv, t); const ev = stepComet(lv, c, DT, t, true); pts.push({ x: c.x, y: c.y }); if (ev && ev.e !== 'warp') break; }
  return pts;
}
