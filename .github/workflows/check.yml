name: comprobar-web
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 90
          B=https://juanbalmasedapereda-dotcom.github.io/juu
          for p in "" lazo/ orbita/ cefiro/ marea/ marchando/ isla/ clavado/ lazo/manifest.webmanifest cefiro/sw.js clavado/icon-192.png; do
            curl -s -o /tmp/out -w "HTTP %{http_code} %{size_download}B $p\n" "$B/$p"
          done
          for g in lazo orbita cefiro marea marchando isla clavado; do echo "$g: $(curl -s $B/$g/ | grep -o '<title>[^<]*</title>' | head -1)"; done
