name: comprobar-web
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 60
          for p in "" orbita/ orbita/manifest.webmanifest orbita/sw.js orbita/icon-192.png; do
            echo "== https://juanbalmasedapereda-dotcom.github.io/juu/$p"
            curl -s -o /tmp/out -w 'HTTP %{http_code} %{content_type} %{size_download}B final=%{url_effective}\n' -L "https://juanbalmasedapereda-dotcom.github.io/juu/$p"
          done
          curl -sL https://juanbalmasedapereda-dotcom.github.io/juu/orbita/ | grep -o '<title>[^<]*</title>'
