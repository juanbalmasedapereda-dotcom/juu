name: comprobar-web
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://juanbalmasedapereda-dotcom.github.io/juu
          for p in "" clavado/ clavado/manifest.webmanifest clavado/sw.js clavado/icon-192.png clavado/icon-512.png; do
            curl -s -o /tmp/out -w "HTTP %{http_code} %{content_type} %{size_download}B $p\n" "$B/$p"
          done
          curl -s $B/clavado/ | grep -o '<link[^>]*manifest[^>]*>\|serviceWorker[^;]*' | head -5
          curl -s $B/clavado/manifest.webmanifest
